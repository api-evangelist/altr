aid: altr
name: ALTR
description: ALTR is a unified data security platform that discovers, classifies, masks, tokenizes and monitors sensitive
  data across Snowflake, Databricks and OLTP databases (PostgreSQL, MySQL, SQL Server, Oracle, MongoDB). The platform combines
  automated data classification, tag-based and column-based dynamic data masking, role-based access control, access-approval
  workflows, database activity monitoring with alerting, format-preserving encryption, and both vaulted and PCI-scoped critical
  tokenization. Everything the console does is exposed through a large public REST surface — a Management API plus purpose-built
  classification, policy, RBAC, tagging, audit, telemetry and sidecar-configuration services — alongside an official open-source
  MCP server, a Terraform provider and a Node.js Shield SDK. Founded in 2018 and headquartered in Austin, Texas.
image: https://altr.com/wp-content/uploads/2025/05/Home-1.png
url: https://raw.githubusercontent.com/api-evangelist/altr/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.21'
created: '2026-08-06'
modified: '2026-08-06'
tags:
- data-security
- data-governance
- data-masking
- tokenization
- data-classification
- access-control
- snowflake
- databricks
- format-preserving-encryption
- database-activity-monitoring
- rbac
- pii
- compliance
- data-privacy
- mcp
- agent-native
apis:
- name: Vaulted Tokenization API
  description: >-
    Tokenizes and detokenizes sensitive data through ALTR's token vault for analytics and transactional
    workloads, including bring-your-own-key. The public reference endpoint returns HTTP 403 to anonymous
    callers, so no machine-readable specification could be captured.
  humanURL: >-
    https://docs.altr.com/features/advanced-data-protection/data-tokenization/vaulted-tokenization/
  baseURL: https://{orgID}.vault.live.altr.com/api/v2
  tags:
  - tokenization
  - data-privacy
  properties:
  - type: Documentation
    url: >-
      https://docs.altr.com/features/advanced-data-protection/data-tokenization/vaulted-tokenization/
  - type: Authentication
    url: authentication/altr-authentication.yml
- name: Key Management API (KMA)
  description: >-
    Manages the keys and tweaks used for ALTR Format-Preserving Encryption (FPE). The reference is served
    per organization at https://<organization-id>.kma.live.altr.com/v1/docs, so no anonymous machine-readable
    specification is reachable.
  humanURL: https://docs.altr.com/account-and-api/api/
  baseURL: https://{orgID}.kma.live.altr.com/v1
  tags:
  - encryption
  - key-management
  - format-preserving-encryption
  properties:
  - type: Documentation
    url: https://docs.altr.com/account-and-api/api/
  - type: Authentication
    url: authentication/altr-authentication.yml
- name: ALTR MCP Server
  description: >-
    Official open-source Model Context Protocol server published by ALTR, exposing 156 tools across 13
    domains (databases, tags, policies, classification, access management, access requests, audits, audit
    reports, telemetry, sidecar configuration, vault and critical tokenization, key management) so AI
    assistants can manage ALTR data security directly. Distributed on PyPI as altr-mcp and registered
    in the official MCP registry; runs over stdio, SSE or streamable-http.
  humanURL: https://github.com/altrsoftware/altr-mcp-server
  baseURL: https://pypi.org/project/altr-mcp/
  tags:
  - mcp
  - agent-native
  - data-security
  - data-governance
  properties:
  - type: MCPServer
    url: mcp/altr-mcp.yml
  - type: ToolCrosswalk
    url: mcp/altr-tool-crosswalk.yml
  - type: Documentation
    url: https://github.com/altrsoftware/altr-mcp-server/blob/main/docs/index.md
  - type: SourceCode
    url: https://github.com/altrsoftware/altr-mcp-server
  - type: ErrorCatalog
    url: errors/altr-problem-types.yml
