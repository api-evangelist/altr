aid: altr
name: ALTR
description: ALTR is a unified data security platform that discovers, classifies, masks, tokenizes and monitors sensitive
  data across Snowflake, Databricks and OLTP databases (PostgreSQL, MySQL, SQL Server, Oracle, MongoDB). The platform combines
  automated data classification, tag-based and column-based dynamic data masking, role-based access control, access-approval
  workflows, database activity monitoring with alerting, format-preserving encryption, and both vaulted and PCI-scoped critical
  tokenization. Everything the console does is exposed through a large public REST surface — a Management API plus purpose-built
  classification, policy, RBAC, tagging, audit, telemetry and sidecar-configuration services — alongside an official open-source
  MCP server, a Terraform provider and a Node.js Shield SDK. Founded in 2018 and headquartered in Austin, Texas.
image: https://altr.com/wp-content/uploads/2025/05/Home-1.png
