    post:
      description: 'Records an approve or reject decision for a job. A decision targets an object path (database, schema,
        table, column — contiguous from the database down) and may additionally narrow to a single classifier via classifier_name,
        an optional filter at any object level. Examples: {database} approves every classifier under the database; {database,
        classifier_name} approves one classifier across the whole database; {database, schema, table, column, classifier_name}
