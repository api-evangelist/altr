  /jobs/databricks:
    post:
      description: 'Creates a new Databricks classification job using Google DLP. Scans all accessible catalogs and tables
        in the connected Databricks workspace.


        **GDLP collection:** Optionally specify `collection_name` to restrict classification to the infoTypes defined in that
        collection. When omitted, all default Google DLP infoTypes are used.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jobs.CreateDatabricksJobInput'
            examples:
              Databricks — all infoTypes:
                summary: Scan all catalogs and tables using all default Google DLP infoTypes
                value:
                  database_id: 57
              Databricks — scoped collection:
                summary: Restrict inspection to specific infoTypes via a GDLP collection
                value:
                  database_id: 57
                  collection_name: financial_pci
              Databricks + DATA_LENGTH — evaluate value-length conditions:
                summary: Databricks GDLP scan with DATA_LENGTH in condition_types. The classifier Lambda measures per-column
                  byte-length histograms from its sample; DATA_LENGTH leaves evaluate against them with the per-leaf comparator,
                  length, trim, and minimum_threshold.
                value:
                  database_id: 845
                  collection_name: pii-baseline
                  condition_types:
                  - GDLP
                  - METADATA
                  - COLUMN_LOCATION
                  - DATA_LENGTH
              Databricks + COLUMN_SIZE — evaluate declared column-size conditions:
                summary: Databricks GDLP scan with COLUMN_SIZE in condition_types. The classifier Lambda reads each column's
                  declared type and size from the table schema (e.g. varchar(255) -> 255; unbounded STRING auto-resolves evaluated=false);
                  COLUMN_SIZE leaves evaluate against the declared size with the per-leaf comparator.
                value:
                  database_id: 845
                  collection_name: pii-baseline
                  condition_types:
                  - GDLP
                  - METADATA
                  - COLUMN_LOCATION
                  - COLUMN_SIZE
              Databricks + CONTENT_TYPE — evaluate content-format conditions:
                summary: Databricks GDLP scan with CONTENT_TYPE in condition_types. The classifier Lambda emits a per-column
                  content-format aggregate (single detection pass per column); the report generator distributes it to every
                  CONTENT_TYPE leaf in compound rulesets.
                value:
                  database_id: 57
                  collection_name: structured_payload_classifiers
                  condition_types:
                  - GDLP
                  - METADATA
                  - COLUMN_LOCATION
                  - CONTENT_TYPE
              Databricks + AMAZON_COMPREHEND — ML PII detection:
                summary: Databricks GDLP scan with AMAZON_COMPREHEND in condition_types. The classifier Lambda runs AWS Comprehend
                  PII detection over each column's sample (using the Lambda's IAM role — no BYOK) alongside Google DLP, and
                  evaluates every AMAZON_COMPREHEND leaf. AMAZON_COMPREHEND leaves carry entity_type + minimum_score (spec)
                  and actual_score + finding_count (evidence) on the decision_lineage.
                value:
                  database_id: 845
                  collection_name: pii-baseline
                  condition_types:
                  - GDLP
                  - METADATA
                  - COLUMN_LOCATION
                  - AMAZON_COMPREHEND
        description: Databricks job details
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.JobItem'
          description: Job created successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Invalid request body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: GDLP collection not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Job already exists
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Internal server error
      security:
      - basic: []
      summary: Create Databricks GDLP classification job
      tags:
      - Classification Jobs
