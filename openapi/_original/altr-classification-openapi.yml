        condition_types:
          description: 'ConditionTypes specifies which evaluation passes to run for this job.

            Valid values: ROW_DATA, METADATA, COLUMN_LOCATION, GDLP, SNOWFLAKE_NATIVE,

            CONTENT_TYPE, DATA_LENGTH, COLUMN_SIZE, AMAZON_COMPREHEND.

            When absent (nil), derived from sample_strategy for backward compatibility;

            an explicitly empty list ([]) means "evaluate no targets" (every leaf

            auto-resolves evaluated=false). Stored as a DynamoDB List (not a String Set)

            so the empty case is representable — a String Set cannot be empty and would

            drop [] to absent. Readers unmarshal both List and legacy String Set into

