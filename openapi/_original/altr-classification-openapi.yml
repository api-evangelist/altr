        maximum_length:
          type: integer
        regex_pattern:
          type: string
        sample_size:
          type: integer
        sample_type:
          type: string
        schema_name:
          type: string
        table_name:
          type: string
        total_rows:
          type: integer
        updated_at:
          type: string
