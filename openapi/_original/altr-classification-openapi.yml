    gitlab_ch5_altr_com_altrdb_altr-classification-engine_pkg_management_types.Condition:
      properties:
        comparator:
          $ref: '#/components/schemas/types.MetadataComparator'
        conditions:
          items:
            $ref: '#/components/schemas/gitlab_ch5_altr_com_altrdb_altr-classification-engine_pkg_management_types.Condition'
          type: array
          uniqueItems: false
        content_format:
          $ref: '#/components/schemas/types.ContentFormat'
        content_formats:
          items:
            $ref: '#/components/schemas/types.ContentFormat'
          type: array
          uniqueItems: false
        dominance_threshold:
          type: number
        entity_type:
          description: 'AMAZON_COMPREHEND-specific leaf fields (present when Target == AMAZON_COMPREHEND).

            The leaf passes when the column''s Comprehend PII detection finds EntityType

            at >= MinimumScore confidence (default 0.5 when omitted/zero). Requires row

            data — auto-resolves evaluated=false on METADATA-only paths or when

            AMAZON_COMPREHEND is absent from condition_types.'
          example: EMAIL
          type: string
        info_type:
          description: 'GDLP-specific leaf fields (present when Target == "GDLP").

            GDLP conditions are evaluated using the Google Cloud DLP API. They require GCP

            credentials to be present at classification runtime. When credentials are absent,

            GDLP conditions evaluate to false (lazy evaluation — the job continues without error).

            Use CompoundRuleset.HasGDLPConditions() to detect these conditions before job dispatch.'
          type: string
        length:
          description: 'DATA_LENGTH-specific leaf fields (present when Target == DATA_LENGTH).

            The leaf compares each sampled value''s true data size — the UTF-8 byte

            length of the value — against Length using Comparator (one of

            greater_than, greater_than_or_equal, less_than, less_than_or_equal,

            equals). When Trim is true, surrounding whitespace is stripped before

            measuring. The leaf passes when at least MinimumThreshold percent of the

            column''s non-null sampled values satisfy the comparison (default 80).'
          example: 100
          minimum: 0
          type: integer
        location:
          $ref: '#/components/schemas/types.ColumnLocation'
        minimum_confidence:
          description: 'MinimumConfidence is an optional confidence gate (HIGH/MEDIUM/LOW) for

            SNOWFLAKE_NATIVE leaves. When set, the leaf matches only when the column''s

            actual Snowflake confidence tier meets or exceeds this value

            (HIGH > MEDIUM > LOW). When absent AND Snowflake emitted a confidence

            signal for the column, the evaluator applies the default tier (LOW) — so

            any column Snowflake classified with at least LOW confidence is eligible.

            When Snowflake did not emit a confidence signal (flat top-level shape),

            the gate is skipped and category match alone is sufficient.'
          example: HIGH
          type: string
        minimum_coverage:
          description: 'MinimumCoverage is an optional coverage gate (0.0-1.0) for SNOWFLAKE_NATIVE

            leaves. When set, the leaf matches only when the column''s actual coverage

            ratio meets or exceeds this threshold. When absent AND Snowflake emitted

            a coverage value, the evaluator applies the default threshold (0.70). When

            Snowflake did not emit a coverage value, the gate is skipped.'
          example: 0.7
          type: number
        minimum_likelihood:
          type: string
        minimum_score:
          example: 0.5
          maximum: 1
          minimum: 0
          type: number
        minimum_threshold:
          description: 'Per-leaf minimum-match threshold (optional), as a percent in (0, 100].

            Used by ROW_DATA and DATA_LENGTH leaves: the leaf matches only when at

            least this percent of sampled values satisfy the comparison (default 80).

            Rejected at validation on COLUMN_SIZE leaves (the comparison is binary).'
          type: number
        negated:
          type: boolean
        operator:
          $ref: '#/components/schemas/types.ConditionOperator'
        pattern:
          example: (?i)ssn|social_security|ss_num
          type: string
        privacy_category:
          example: IDENTIFIER
          type: string
        semantic_category:
          description: 'SNOWFLAKE_NATIVE-specific leaf fields (present when Target == "SNOWFLAKE_NATIVE").

            SNOWFLAKE_NATIVE conditions evaluate against the SEMANTIC_CATEGORY and/or

            PRIVACY_CATEGORY tags emitted by Snowflake''s native classifier (SYSTEM$CLASSIFY /

            EXTRACT_SEMANTIC_CATEGORIES). Only meaningful when the source is Snowflake and the

            classification job produced TAG_IMPORT results (classification_type 2 or 4) or a

            hosted-collection path that ingested those tags. When the source is not Snowflake

            or no SF native tag data is available, the condition is auto-resolved with

            evaluated=false in lineage (vacuously true under AND, false under OR — same pattern

            as GDLP without credentials). At least one of SemanticCategory or PrivacyCategory

            must be non-empty. When both are set, both must match (AND semantics within the leaf).'
          example: EMAIL
          type: string
        size:
          description: 'COLUMN_SIZE-specific leaf fields (present when Target == COLUMN_SIZE).

            The leaf compares the column''s declared size (from schema/catalog metadata,

            e.g. VARCHAR(255) → 255) against Size using Comparator (one of

            greater_than, greater_than_or_equal, less_than, less_than_or_equal,

            equals). Metadata-level: evaluates in all sampling modes including

            METADATA-only. Binary per-column: no trim, no minimum_threshold.'
          example: 100
          minimum: 0
          type: integer
        tags:
          description: 'Tags are optional semantic labels on this condition node — valid on both

            leaves and groups. When the node contributes to a true evaluation outcome

            its tags percolate into the decision lineage''s matched_tags, giving hits a

            method-independent identity for downstream consumers (e.g. a group tagged

            "type:ssn" whose GDLP, AMAZON_COMPREHEND, and ROW_DATA leaves all detect

            SSNs reports "type:ssn" whichever detector fired). Each tag is a lowercase

            key:value pair joined by a single required '':'' ("type:ssn", "reg:hipaa") —

            bare colon-less values are rejected; at most MaxTagsPerCondition per node,

            with the key at most MaxTagKeyLength bytes and the value at most

            MaxTagValueLength bytes. Keys starting with "altr" are reserved for

            ALTR-authored tags and rejected on user writes.'
          example:
          - type:ssn
          items:
            type: string
          type: array
          uniqueItems: false
        target:
          $ref: '#/components/schemas/types.ConditionTarget'
        trim:
          example: true
          type: boolean
      type: object
    gitlab_ch5_altr_com_altrdb_altr-classification-engine_pkg_management_types.JobStatus:
      enum:
      - CREATED
      - RESUMED
      - PAUSED
      - RUNNING
      - COMPLETED
      - CANCELLED
      - PENDING_CANCEL
      - FAILED
      - UPLOADING_REPORT
      - PROCESSING_REPORT
      - PROCESSING_FINDINGS
      - AWAITING_REVIEW
      type: string
      x-enum-varnames:
      - JobStatusCreated
      - JobStatusResumed
      - JobStatusPaused
      - JobStatusRunning
      - JobStatusCompleted
      - JobStatusCancelled
      - JobStatusPendingCancel
      - JobStatusFailed
      - JobStatusUploadingReport
      - JobStatusProcessingReport
      - JobStatusProcessingFindings
      - JobStatusAwaitingReview
    jobs.CreateDatabricksJobInput:
      properties:
        collection_name:
          description: Collection name (GDLP collection) to scope which infoTypes are inspected. When omitted, all default
            Google DLP infoTypes are used.
          example: financial_pci
          type: string
          x-order: '1'
        condition_types:
          description: 'Condition types to evaluate. Defaults to ["GDLP", "METADATA", "COLUMN_LOCATION", "CONTENT_TYPE"] when
            omitted (ROW_DATA is excluded because Databricks GDLP does not evaluate classifier regex against samples by default).
            Valid: ROW_DATA, METADATA, COLUMN_LOCATION, GDLP, SNOWFLAKE_NATIVE, CONTENT_TYPE, DATA_LENGTH, COLUMN_SIZE, AMAZON_COMPREHEND.
            AMAZON_COMPREHEND runs AWS Comprehend ML PII detection on the classifier Lambda''s sample.'
          items:
            type: string
          type: array
          uniqueItems: false
          x-order: '2'
        database_id:
          description: Database ID of the registered Databricks workspace to classify.
          example: 57
          type: integer
          x-order: '0'
        requires_review:
          description: 'When true, the job is gated for Human-in-the-Loop review: the classification report is held as a reviewable
            draft and is not published until every finding is decided and the report is confirmed via POST /jobs/{job_id}/report/confirm.
            Defaults to false (report published immediately).'
          example: false
          type: boolean
          x-order: '3'
      required:
      - database_id
      type: object
    jobs.CreateJobInput:
      properties:
        agent_id:
          description: OLTP job fields
          type: string
          x-order: '3'
        classification_type:
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          example: 5
          type: integer
          x-order: '7'
        collection_name:
          type: string
          x-order: '1'
        condition_types:
          description: 'Job-level condition targets (optional). When provided, drives which

            compound-ruleset leaf targets are evaluated and takes precedence over the

            legacy sample_strategy derivation. Absent (nil) => derive from

            sample_strategy; explicitly empty ([]) => evaluate no targets. Mirrors the

            dedicated POST /jobs/snowflake and /jobs/oltp endpoints so the umbrella

            /jobs endpoint honors condition_types too.'
          items:
            type: string
          type: array
          uniqueItems: false
          x-order: '12'
        database_id:
          description: Standard job fields
          type: integer
          x-order: '0'
        job_type:
          enum:
          - FULL
          - INCREMENTAL
          type: string
          x-order: '2'
        repo_name:
          type: string
          x-order: '4'
        sample_size:
          description: Job-level sampling (OLTP only, optional)
          type: integer
          x-order: '10'
        sample_strategy:
          type: string
          x-order: '6'
        sample_type:
          type: string
          x-order: '11'
        service_name:
          type: string
          x-order: '9'
        service_user_name:
          type: string
          x-order: '5'
        sid:
          description: Oracle-specific fields
          type: string
          x-order: '8'
      type: object
    jobs.CreateOLTPJobInput:
      properties:
        agent_id:
          description: Agent ID (UUID) of the classification agent that will execute this job.
          example: c5750de6-170d-46d3-a9bc-b5f7ba032ad0
          type: string
          x-order: '0'
        classification_type:
          description: Classification type. 5=ALTRNative (regex), 6=GDLP BYOK (Google DLP with customer GCP credentials).
          enum:
          - 5
          - 6
          example: 5
          type: integer
          x-order: '4'
        collection_name:
          description: Collection name. Required for ALTRNative (type 5, ALTR classifier collection). Optional for GDLP BYOK
            (type 6, GDLP collection to scope infoTypes).
          example: pii_classifiers
          type: string
          x-order: '5'
        condition_types:
          description: 'Condition types to evaluate. Auto-derived from sample_strategy when omitted. Valid: ROW_DATA, METADATA,
            COLUMN_LOCATION, GDLP, CONTENT_TYPE, DATA_LENGTH, COLUMN_SIZE, AMAZON_COMPREHEND. AMAZON_COMPREHEND runs AWS Comprehend
            ML PII detection on sampled rows (requires ROW_DATA sampling + Comprehend credentials).'
          items:
            type: string
          type: array
          uniqueItems: false
          x-order: '10'
        repo_name:
          description: Repository name registered in ALTR for the database to classify.
          example: production_postgres
          type: string
          x-order: '1'
        requires_review:
          description: 'Opt into the HitL report gate. When true, report generation produces only the

            review substrate and the consumable report is deferred until POST

            /jobs/{job_id}/report/confirm runs with all findings decided. Defaults false.'
          type: boolean
          x-order: '16'
        sample_size:
          description: Number of rows to sample per column. Required when sample_strategy is ROWS or COMBINED.
          example: 1000
          type: integer
          x-order: '8'
        sample_strategy:
          description: 'Sampling strategy. ROWS: classify sampled row data. METADATA: column names only. COMBINED: both. GDLP
            BYOK (type 6) only supports ROWS.'
          enum:
          - ROWS
          - METADATA
          - COMBINED
          example: ROWS
          type: string
          x-order: '3'
        sample_type:
          description: 'Sampling method. ROWS: fixed count. PERCENT: percentage.'
          enum:
          - ROWS
          - PERCENT
          example: ROWS
          type: string
          x-order: '9'
        service_name:
          description: Oracle service name (mutually exclusive with sid).
          example: orcl.example.com
          type: string
          x-order: '7'
        service_user_name:
          description: Service user name with read access to the database.
          example: altr_classification_svc
          type: string
          x-order: '2'
        sid:
          description: Oracle SID (mutually exclusive with service_name).
          example: ORCL
          type: string
          x-order: '6'
        task_id:
          description: Optional task identifier for telemetry correlation
          type: string
          x-order: '15'
      type: object
    jobs.CreateSnowflakeJobInput:
      properties:
        classification_type:
          description: "Classification engine to use. Defaults to altr_native when omitted.\n  - altr_native: ALTR regex classification\
            \ via Snowflake UDFs. Requires collection_name and job_type.\n  - gdlp: Google DLP classification hosted by ALTR.\
            \ Optionally accepts collection_name to scope infoTypes."
          enum:
          - altr_native
          - gdlp
          example: altr_native
          type: string
          x-order: '1'
        collection_name:
          description: Collection name. Required for altr_native (ALTR classifier collection). Optional for gdlp (GDLP collection
            to scope infoTypes).
          example: pii_classifiers
          type: string
          x-order: '2'
        condition_types:
          description: 'Condition types to evaluate. Auto-derived from sample_strategy when omitted.

            Valid: ROW_DATA, METADATA, COLUMN_LOCATION, GDLP, SNOWFLAKE_NATIVE, CONTENT_TYPE, DATA_LENGTH, COLUMN_SIZE, AMAZON_COMPREHEND.
            AMAZON_COMPREHEND is evaluated only on the GDLP worker path; on the ALTR Native in-warehouse pushdown it auto-resolves
            evaluated=false.

            SNOWFLAKE_NATIVE evaluates against the SEMANTIC_CATEGORY / PRIVACY_CATEGORY

            tags produced by Snowflake''s native classifier and is auto-enabled on

            Snowflake-native job types (classification_type 2 / 3 / 4).'
          items:
            type: string
          type: array
          uniqueItems: false
          x-order: '7'
        database_id:
          description: Database ID of the registered Snowflake database to classify.
          example: 42
          type: integer
          x-order: '0'
        job_type:
          description: Job type. Required for altr_native; defaults to FULL for gdlp.
          enum:
          - FULL
          - INCREMENTAL
          example: FULL
          type: string
          x-order: '3'
        requires_review:
          description: 'When true, defer the consumable report behind the human review gate: the job

            pauses at AWAITING_REVIEW until decisions are confirmed via POST /jobs/{id}/report/confirm.'
          example: false
          type: boolean
          x-order: '8'
        sample_size:
          description: Number of rows to sample per column. Defaults to 100 when omitted.
          example: 500
          type: integer
          x-order: '5'
        sample_strategy:
          description: 'Sampling strategy. ROWS: sample row data. METADATA: column names only (altr_native only). COMBINED:
            both.'
          enum:
          - ROWS
          - METADATA
          - COMBINED
          example: COMBINED
          type: string
          x-order: '4'
        sample_type:
          description: 'Sampling method. ROWS: fixed row count. PERCENT: percentage of total rows.'
          enum:
          - ROWS
          - PERCENT
          example: ROWS
          type: string
          x-order: '6'
      required:
      - database_id
      type: object
