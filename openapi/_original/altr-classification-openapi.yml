                summary: Snowflake GDLP scan with COLUMN_SIZE in condition_types. The GDLP worker captures each column's declared
                  type and size from the TABLESAMPLE result-set metadata; the report generator evaluates every COLUMN_SIZE
                  leaf (greater_than / less_than / equals etc.) against the declared size.
                value:
                  database_id: 1342
                  classification_type: gdlp
                  collection_name: pii-baseline
                  job_type: FULL
                  condition_types:
                  - GDLP
                  - METADATA
                  - COLUMN_LOCATION
                  - COLUMN_SIZE
