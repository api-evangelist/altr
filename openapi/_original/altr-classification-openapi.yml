  /jobs/oltp:
    post:
      description: Creates a new agent-based (OLTP) classification job. Requires an agent_id identifying the classification
        agent, repository connection details, and service user credentials.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jobs.CreateOLTPJobInput'
            examples:
              ALTR Native — row sampling:
                summary: Regex classification with 1000 sampled rows per column
                value:
                  agent_id: c5750de6-170d-46d3-a9bc-b5f7ba032ad0
                  repo_name: production_postgres
                  service_user_name: altr_classification_svc
                  sample_strategy: ROWS
                  sample_size: 1000
                  sample_type: ROWS
                  classification_type: 5
                  collection_name: pii_classifiers
              ALTR Native — metadata only:
                summary: Classify columns by name only — no database connection needed for sampling
                value:
                  agent_id: c5750de6-170d-46d3-a9bc-b5f7ba032ad0
                  repo_name: production_postgres
                  service_user_name: altr_classification_svc
                  sample_strategy: METADATA
                  classification_type: 5
                  collection_name: pii_classifiers
              ALTR Native — partial condition_types (METADATA + COLUMN_LOCATION only):
                summary: Evaluate only METADATA and COLUMN_LOCATION conditions; ROW_DATA conditions are auto-resolved to false
                  (no row sampling performed)
                value:
                  agent_id: c5750de6-170d-46d3-a9bc-b5f7ba032ad0
                  repo_name: production_postgres
                  service_user_name: altr_classification_svc
                  classification_type: 5
                  collection_name: pii_classifiers
                  condition_types:
                  - METADATA
                  - COLUMN_LOCATION
              ALTR Native + DATA_LENGTH — evaluate value-length conditions on sampled rows:
                summary: Include DATA_LENGTH in condition_types so the agent measures each sampled value's byte length and
                  evaluates every DATA_LENGTH leaf (greater_than / less_than / equals etc.). Requires ROW_DATA sampling.
                value:
                  agent_id: 9b2f1c44-7a6e-4f7e-9d2b-1d2f3a4b5c6d
                  classification_type: 5
                  collection_name: pii-baseline
                  repo_name: orders-mysql
                  sample_strategy: COMBINED
                  service_name: orders
                  service_user_name: altr_svc
                  sample_size: 100
                  sample_type: ROWS
                  condition_types:
                  - ROW_DATA
                  - METADATA
                  - COLUMN_LOCATION
                  - DATA_LENGTH
              ALTR Native + COLUMN_SIZE — evaluate declared column-size conditions:
                summary: 'Include COLUMN_SIZE in condition_types so the agent evaluates every COLUMN_SIZE leaf against each
                  column''s declared catalog size (e.g. VARCHAR(255) -> 255). COLUMN_SIZE is metadata-level: it does not require
                  row sampling and is evaluable under METADATA sampling.'
                value:
                  agent_id: 9b2f1c44-7a6e-4f7e-9d2b-1d2f3a4b5c6d
                  classification_type: 5
                  collection_name: pii-baseline
                  repo_name: orders-mysql
                  sample_strategy: METADATA
                  service_name: orders
                  service_user_name: altr_svc
                  condition_types:
                  - METADATA
                  - COLUMN_LOCATION
                  - COLUMN_SIZE
              ALTR Native + CONTENT_TYPE — evaluate content-format conditions on sampled rows:
                summary: Include CONTENT_TYPE in condition_types so the agent runs content-format detection once per column
                  and evaluates every CONTENT_TYPE leaf against the dominant detected format. Requires ROW_DATA sampling.
                value:
                  agent_id: c5750de6-170d-46d3-a9bc-b5f7ba032ad0
                  repo_name: production_postgres
                  service_user_name: altr_classification_svc
                  sample_strategy: ROWS
                  sample_size: 1000
                  sample_type: ROWS
                  classification_type: 5
                  collection_name: structured_payload_classifiers
                  condition_types:
                  - ROW_DATA
                  - METADATA
                  - COLUMN_LOCATION
                  - CONTENT_TYPE
              GDLP BYOK — all infoTypes:
                summary: Google DLP classification using customer GCP credentials
                value:
                  agent_id: c5750de6-170d-46d3-a9bc-b5f7ba032ad0
                  repo_name: production_postgres
                  service_user_name: altr_classification_svc
                  sample_strategy: ROWS
                  sample_size: 100
                  sample_type: ROWS
                  classification_type: 6
              GDLP BYOK — scoped collection:
                summary: Google DLP with a GDLP collection to limit inspected infoTypes
                value:
                  agent_id: c5750de6-170d-46d3-a9bc-b5f7ba032ad0
                  repo_name: production_oracle
                  service_user_name: altr_classification_svc
                  sample_strategy: ROWS
                  sample_size: 200
                  sample_type: ROWS
                  classification_type: 6
                  collection_name: healthcare_phi
                  service_name: ORCL
              GDLP BYOK — GDLP + METADATA condition_types:
                summary: 'Google DLP with explicit condition_types: evaluates GDLP and METADATA conditions; COLUMN_LOCATION
                  and ROW_DATA are auto-resolved to false'
                value:
                  agent_id: c5750de6-170d-46d3-a9bc-b5f7ba032ad0
                  repo_name: production_postgres
                  service_user_name: altr_classification_svc
                  sample_size: 100
                  sample_type: ROWS
                  classification_type: 6
                  collection_name: healthcare_phi
                  condition_types:
                  - GDLP
                  - METADATA
              ALTR Native + AMAZON_COMPREHEND — ML PII detection on sampled rows:
                summary: Include AMAZON_COMPREHEND in condition_types so the agent runs AWS Comprehend PII detection (a cheap
                  ContainsPiiEntities screen, then DetectPiiEntities only on columns that screen positive) over each column's
                  sampled values and evaluates every AMAZON_COMPREHEND leaf. Requires ROW_DATA sampling. Comprehend credentials
                  come from COMPREHEND_AWS_ACCESS_KEY_ID/SECRET (BYOK override), COMPREHEND_ROLE_ARN (cross-account assume-role,
                  auto-refreshed), or the agent's default AWS chain; Comprehend cost bills to the supplying account.
                value:
                  agent_id: c5750de6-170d-46d3-a9bc-b5f7ba032ad0
                  repo_name: production_postgres
                  service_user_name: altr_classification_svc
                  sample_strategy: ROWS
                  sample_size: 100
                  sample_type: ROWS
                  classification_type: 5
                  collection_name: pii_classifiers
                  condition_types:
                  - ROW_DATA
                  - METADATA
                  - COLUMN_LOCATION
                  - AMAZON_COMPREHEND
        description: OLTP job details
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.JobItem'
          description: Job created successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Invalid request body, validation error, or GDLP collection not found/deleted
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Collection, repo, or service user not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Job already exists
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Internal server error
      security:
      - basic: []
      summary: Create OLTP classification job
      tags:
      - Classification Jobs
  /jobs/snowflake:
    post:
      description: 'Creates a new Snowflake-based classification job.


        **Classification type:** Controls which classification engine runs the job.

        - `altr_native` (default when omitted): ALTR''s built-in regex classification via Snowflake UDFs. Requires `collection_name`
        and `job_type`.

        - `gdlp`: Google DLP-powered classification hosted by ALTR. Does not require `job_type` (defaults to FULL). Optionally
        accepts `collection_name` to scope which infoTypes are inspected.


        **Sample strategies:** ROWS (sample a fixed number of rows per column), METADATA (column names only — ALTR Native
        only), COMBINED (both row data and metadata).


        **Sampling configuration:** Optionally specify `sample_size` and `sample_type` to control how many rows are sampled
        per column. Defaults to 100 ROWS when not provided. When `sample_strategy` is METADATA, sampling fields are not used.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jobs.CreateSnowflakeJobInput'
            examples:
              ALTR Native — row sampling:
                summary: Regex classification with 500 sampled rows per column
                value:
                  database_id: 42
                  collection_name: pii_classifiers
                  sample_size: 500
                  sample_type: ROWS
              ALTR Native — metadata only:
                summary: Classify columns by name only — no row data sampled
                value:
                  database_id: 42
                  collection_name: pii_classifiers
                  sample_strategy: METADATA
              GDLP — all infoTypes:
                summary: Google DLP scan using all ~150 built-in infoTypes
                value:
                  database_id: 42
                  classification_type: gdlp
              GDLP — scoped to collection:
                summary: Google DLP scan restricted to specific infoTypes (e.g. healthcare PHI)
                value:
                  database_id: 42
                  classification_type: gdlp
                  collection_name: healthcare_phi
              GDLP — with sampling:
                summary: Google DLP scan with explicit row sampling configuration
                value:
                  database_id: 42
                  classification_type: gdlp
                  collection_name: financial_pci
                  sample_size: 200
                  sample_type: ROWS
              GDLP — explicit condition_types (GDLP + METADATA):
                summary: GDLP scan evaluating only GDLP and METADATA conditions; COLUMN_LOCATION is auto-resolved to false
                value:
                  database_id: 42
                  classification_type: gdlp
                  collection_name: financial_pci
                  condition_types:
                  - GDLP
                  - METADATA
              ALTR Native — SNOWFLAKE_NATIVE condition_types:
                summary: ALTR Native scan that additionally evaluates SNOWFLAKE_NATIVE conditions against Snowflake's SEMANTIC_CATEGORY
                  / PRIVACY_CATEGORY tags
                value:
                  database_id: 42
                  collection_name: pii_classifiers
                  sample_strategy: COMBINED
                  sample_size: 500
                  sample_type: ROWS
                  condition_types:
                  - ROW_DATA
                  - METADATA
                  - COLUMN_LOCATION
                  - SNOWFLAKE_NATIVE
              GDLP — cross-target with SNOWFLAKE_NATIVE (extreme coverage):
                summary: Google DLP scan whose collection contains hybrid GDLP + SNOWFLAKE_NATIVE compound classifiers. The
                  worker fetches SEMANTIC_CATEGORY / PRIVACY_CATEGORY tags from INFORMATION_SCHEMA.TAG_REFERENCES_ALL_COLUMNS
                  alongside its DLP findings so both targets evaluate against real data in the same job — GDLP leaf carries
                  actual_likelihood + finding_count, SNOWFLAKE_NATIVE leaf carries actual_semantic_category + actual_privacy_category.
                value:
                  database_id: 42
                  classification_type: gdlp
                  collection_name: hybrid_gdlp_sfnative
                  condition_types:
                  - GDLP
                  - METADATA
                  - SNOWFLAKE_NATIVE
              GDLP — all five condition targets in compound rulesets:
                summary: Google DLP scan against a collection whose compounds combine GDLP + SNOWFLAKE_NATIVE + METADATA +
                  COLUMN_LOCATION. ROW_DATA conditions auto-resolve on the SF GDLP path (no row sampling); GDLP + SF_NATIVE
                  evaluate against Cloud DLP findings + Snowflake tag pre-pass respectively.
                value:
                  database_id: 42
                  classification_type: gdlp
                  collection_name: all_targets_hybrid
                  condition_types:
                  - GDLP
                  - SNOWFLAKE_NATIVE
                  - METADATA
                  - COLUMN_LOCATION
              GDLP + DATA_LENGTH — evaluate value-length conditions:
                summary: Snowflake GDLP scan with DATA_LENGTH in condition_types. The GDLP worker measures per-column byte-length
                  histograms once from TABLESAMPLE rows; the report generator evaluates every DATA_LENGTH leaf (greater_than
                  / less_than / equals etc.) against them.
                value:
                  database_id: 1342
