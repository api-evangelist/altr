        sample_type:
          type: string
        service_user:
          $ref: '#/components/schemas/types.ServiceUser'
        started_at:
          description: Time is always stored RFC3339
          type: string
        status:
          $ref: '#/components/schemas/gitlab_ch5_altr_com_altrdb_altr-classification-engine_pkg_management_types.JobStatus'
        task_id:
          type: string
        updated_at:
          description: Time is always stored RFC3339
          type: string
      type: object
    types.JobType:
      description: Job details
      enum:
      - FULL
      - INCREMENTAL
      type: string
      x-enum-varnames:
