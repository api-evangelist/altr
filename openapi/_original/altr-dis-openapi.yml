        description: Table failures list return limit
        type: int
        default: 10
        required: false
        explode: true
        schema: {}
      responses:
        '200':
          description: Successfully retrieved list (or partial) of tables with corresponding info for a data discovery job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDiscoveryTableList'
