components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: DIS uses [HTTP Basic Authentication](https://swagger.io/docs/specification/authentication/basic-authentication/).<br/><br/>DIS/MAPI
        credentials can be obtained on the [API page](https://altrnet.live.altr.com/settings/preferences/api) (found under
        Settings > Preferences > API) of ALTR's portal for Enterprise and Enterprise+ customers.<br/><br/>Usernames are the
        'Key Names' listed on that page, and Passwords are the 'Key Secret' provided when an API key is created.
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT Info here
  schemas:
    Error:
      type: object
      properties:
        errorCode:
          type: integer
          format: int64
          example: 404
        message:
          type: string
          example: Requested ID did not exist.
    TagGroupDeleted:
      type: object
      properties:
        removed_tag_value_count:
          type: integer
          format: int64
          example: 5
        message:
          type: string
          example: Tag group and associated data tags marked as removed successfully.
    DatabaseList:
      type: array
      items:
        $ref: '#/components/schemas/Database'
    Database:
      type: object
      properties:
        databaseID:
          type: integer
          example: 1
        databaseName:
          type: string
          example: TEST_DATABASE
        databaseFriendlyName:
          type: string
          example: Test Database
        dataDiscoveryJobRan:
          type: boolean
          example: true
    DataDiscoveryJobList:
      type: array
      items:
        $ref: '#/components/schemas/DataDiscoveryJob'
    DataDiscoveryJob:
      type: object
      properties:
        databaseID:
          type: integer
          example: 1
        jobUUID:
          type: string
          example: dis-asdf125-1234-1adf-982c-asdfvfadsfa
        databaseName:
          type: string
          example: DatabaseOne
        startTimeStamp:
          type: string
          example: '2006-01-02T15:04:05Z'
        startTimeSinceEpoch:
          type: long
          example: 1656255468000
        completeTimeStamp:
          type: string
          example: '2006-01-02T15:04:05Z'
        completeTimeSinceEpoch:
          type: long
          example: 1656255468000
        dataDiscoveryTypeString:
          type: string
          example: Google DLP
        dataDiscoveryType:
          type: integer
          example: 1
        status:
          type: string
          example: IN_PROGRESS
        totalColumns:
          type: integer
          example: 10000
        totalTables:
          type: integer
          example: 1000
        completedColumns:
          type: integer
          example: 5000
        completedTables:
          type: integer
          example: 500
        columnsCompletePercentage:
          type: float
          example: 50.0
        tablesCompletePercentage:
          type: float
          example: 50.0
    ClassificationSummary:
      type: object
      properties:
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationSummaryItem'
        totals:
          type: object
          properties:
            classifiedColumns:
              type: integer
              example: 200
            totalColumns:
              type: integer
              example: 500
            percentSuccessfullyClassified:
              type: float
              example: 22.5
    ClassificationSummaryItem:
      type: object
      properties:
        type:
          type: string
          example: SSN
        percent:
          type: float
          example: 20
        amount:
          type: string
          example: Requested ID did not exist.
    ClassificationColumnTypeList:
      type: object
      properties:
        Columns:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationColumnTypeRequestItem'
        Totals:
          type: object
          properties:
            column_count:
              type: integer
              example: 100
    DISJobInfo:
      type: object
      properties:
        clientDatabaseID:
          type: integer
          example: 1
    ClassificationColumnTypeRequestItem:
      type: object
      properties:
        clientDatabaseID:
          type: integer
          example: 1
        databaseTypeName:
          type: string
          example: SnowflakeExternalFunction
        databaseTypeID:
          type: integer
          example: 9
        friendlyDatabaseName:
          type: string
          example: Database One
        database:
          type: string
          example: DATABASE_ONE
        schemaName:
          type: string
          example: SCHEMA_ONE
        tableName:
          type: string
          example: TABLE_ONE
        columnName:
          type: string
          example: COLUMN_ONE
        classifier:
          type: array
          example:
          - FIRST_NAME
        alsoAppearsAs:
          type: array
          example:
          - MALE_NAME
          - FEMALE_NAME
        isGovernable:
          type: boolean
          example: true
        isScatterable:
          type: boolean
          example: true
        dataType:
          type: string
          example: Varchar
        confidence:
          type: string
          example: LIKELY
        dataState:
          type: string
          example: REGISTERED /* {REGISTERED, GOVERNED, PROTECTED } */
        fullyQualifiedTableName:
          type: string
          example: DATABASE_ONE.SCHEMA_ONE.TABLE_ONE
    DataDiscoveryTableFailureList:
      type: array
      items:
        $ref: '#/components/schemas/DataDiscoveryTableFailure'
    DataDiscoveryTableFailure:
      type: object
      properties:
        jobID:
          type: string
          example: DIS-UUID
        tableJobID:
          type: string
          example: UUID
