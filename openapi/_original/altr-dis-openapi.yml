  /masking/v2/column/types/{fieldId}/:
    get:
      tags:
      - Data Masking
      summary: Checks column masking types.
      description: 'Checks to see if the column can be masked with given mask for a client. <br/><br/>  Normalized data types:
        <blockquote><b> [ <blockquote> STRING,<br/> NUMBER,<br/> DATETIME </blockquote>]</b></blockquote> ReplacementStrategies:
        <br/><blockquote><b>[<blockquote> REPLACEMENT_STRATEGY_NOOP = 0;<br/> ALL = 1;              // Replace the entire
        original string with Replacement.value<br/> CHAR = 2;             // Replace every character with Replacement.value<br/>EMAIL
        = 3;            // Replace every character in local part of email with Replacement.value<br/>LAST_FOUR = 4;        //
        Replace every character except for the final four and certain delimiters with Replacement.value<br/>CONSTANT_REPLACE
        = 5; // Replace entire original value with constant <br/></blockquote> ]</b></blockquote>'
      operationId: columnMaskTypes
      parameters:
      - name: fieldId
        in: path
        description: Comes from /api/data list (see <a href="https://altrnet.live.altr.com/api/swagger/#/data">https://altrnet.live.altr.com/api/swagger/#/data</a>)
        required: true
        explode: true
        schema: {}
      responses:
        '200':
          description: Successfully retrieved column list for tagID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayNoMaskingType'
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '401':
          description: Invalid credentials provided
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '404':
          description: No field id exists of this value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        5xx:
          description: Failure servicing this request
