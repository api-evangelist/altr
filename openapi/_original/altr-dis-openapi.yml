openapi: 3.0.3
info:
  title: ALTR Datastore Information Service
  description: 'Welcome to the Swagger documentation for ALTR''s Datastore Information Service (DIS). DIS provides ALTR customers
    ways to programmatically access ALTR Classification, Tags, and Masking information via restful API.


    DIS does not include the endpoints for ALTR''s tokenization API; documentation on ALTR''s tokenization API can be found
    here.


    DIS uses HTTP Basic Authentication. DIS uses the same credentials that MAPI uses. MAPI/DIS credentials can be obtained
    on the API page (found under Settings > Preferences > API) of ALTR''s portal for Enterprise and Enterprise + customers.
    Usernames are the ''Key Names'' listed on that page, and Passwords are the ''Key Secret'' provided when an API key is
    created.'
  termsOfService: https://www.altr.com/info/altr-solutions-inc-terms-of-service
  contact:
    name: Support
    email: support@altr.com
  version: 3.4.3
externalDocs:
  description: Find out more about ALTR
  url: https://docs.altr.com
security:
- bearerAuth: []
  basicAuth: []
servers:
- url: '/v1/dis '
tags:
- name: Data Discovery
  description: Data Classification/Tagging job endpoints
  externalDocs:
    description: Find out more
    url: https://docs.altr.com/explore-altr-features/classification#Classification%20Report
- name: Data Tagging
  description: Information around tagged columns
  externalDocs:
    description: Find out more
    url: https://docs.altr.com/explore-altr-features/locks#object%20tags
- name: Data Masking
  description: Access to column info around available masking types
  externalDocs:
    description: Find out more
    url: https://docs.altr.com/explore-altr-features/locks#Dynamic%20Data%20Masking
- name: Utility
  description: Access DIS job and third party import information.
  externalDocs:
    description: Find out more
    url: https://docs.altr.com/explore-altr-features/locks#Dynamic%20Data%20Masking
paths:
  /classification/v1/db/{databaseId}:
    put:
      tags:
      - Data Discovery
      summary: Start a Classification/Tagging Job.
      description: Starts a classification job for the request client database.
      operationId: startClassification
      parameters:
      - name: databaseId
        in: path
        description: The ALTR Database ID to run a classification/tagging job on. Can be found via the listDBs endpoint.
        required: true
        explode: true
        schema: {}
      - name: classificationType
        in: query
        description: The secondary service used for classification/tagging jobs. Defaults to Google DLP if not included. </br></br>{<blockquote>1,  //  Google
          DLP<br />    2, //  Snowflake Native (Deprecated)<br />    3, // Snowflake Object Tag Import <br />   4, // Snowflake
          Classification and Tag Import</blockquote>}
        required: false
        explode: true
        schema:
          type: integer
          default: 1
          enum:
          - 1
          - 2
          - 3
          - 4
      - name: emailOnCompletion
        in: query
        description: Defaults to sending an email, this header allows you to opt in or out of the job completion email. </br></br>{<blockquote>    0,  //  False<br/>    1  //   True</blockquote>}
        required: false
        explode: true
        schema:
          type: integer
          default: 1
          enum:
          - 0
          - 1
      responses:
        '202':
          description: Classification successfully started or was already running for client database.
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '401':
          description: Invalid credentials provided
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '404':
          description: Client database id not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        5xx:
          description: Failure servicing this request
  /classification/v1/metastore/{databaseId}:
    put:
      tags:
      - Data Discovery
      summary: Start a Classification Job.
      description: Starts a classification job for the request client metastore.
      operationId: startClassificationMetastore
      parameters:
      - name: databaseId
        in: path
        description: The ALTR Database ID to run a classification job on. Can be found via the listDBs endpoint.
        required: true
        explode: true
        schema: {}
      - name: emailOnCompletion
        in: query
        description: Defaults to sending an email, this header allows you to opt in or out of the job completion email. </br></br>{<blockquote>    0,  //  False<br/>    1  //   True</blockquote>}
        required: false
        explode: true
        schema:
          type: integer
          default: 1
          enum:
          - 0
          - 1
      responses:
        '202':
          description: Classification successfully started or was already running for client metastore.
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '401':
          description: Invalid credentials provided
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '404':
          description: Client database id not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        5xx:
          description: Failure servicing this request
  /classification/v2/listDBs:
    get:
      tags:
      - Data Discovery
      summary: Retrieve list of connected client databases.
      description: Gets a list of databases for consumption, includes if a classification has ever been run before.
      operationId: listDBs
      parameters:
      - name: offset
        in: query
        description: List return offset. Minimum 0.
        type: int
        default: 0
        required: false
        explode: true
        schema: {}
      - name: limit
        in: query
        description: List return limit. Minimum 1, Maximum 100.
        type: int
        default: 10
        required: false
        explode: true
        schema: {}
      - name: jobStarted
        in: query
        description: jobStarted, if not specified, will not be considered when returning data. If false, we will only return
          databases that have never had a data discovery job run. If true, the returned set will include databases that have
          had data discovery jobs started - even if they haven't completed.
        type: boolean
        default: null
        required: false
        explode: true
        schema: {}
      - name: jobCompleted
        in: query
        description: 'jobCompleted, if not specified, will not be considered when returning data. If false, we will only return
          databases that have never had a data discovery job complete. If true, we will only return databases that have had
          a data discovery job successfully complete. '
        type: boolean
        default: null
        required: false
        explode: true
        schema: {}
      responses:
        '200':
          description: Successfully retrieved list of databases for the org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseList'
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '204':
          description: No databases found for client org.
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '401':
          description: Invalid credentials provided
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '404':
          description: Client organization not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        5xx:
          description: Failure servicing this request
  /classification/v2/db/status/{databaseId}:
    get:
      tags:
      - Data Discovery
      summary: Retrieve classification job(s) status(es).
      description: 'Returns an array of all classification jobs by the latest run of each distinct classification type for
        a database specific request. You can specify a classification type to only return the status for a specific type '
      operationId: retrieveJobStatusDB
      parameters:
      - name: databaseId
        in: path
        description: Optional database ID - if included will only return jobs specific to this database ID. Database ID can
          be retrieved via the listDBs endpoint
        required: true
        explode: true
        schema: {}
      - name: dataDiscoveryJobType
        in: query
        description: Filter by the secondary service used for classification/tagging jobs. </br></br>{<blockquote>0,  //  Returns
          last ran job of ANY type<br /> 1,  //  Google DLP<br />    2, //  Snowflake Native (Deprecated)<br />    3, // Snowflake
          Tag Import <br />   4, // Snowflake Classify and Tag Import</blockquote>}
        type: string
        required: false
        explode: true
        schema:
          type: integer
          default: 1
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
      - name: offset
        in: query
        description: List return offset. Minimum 0.
        type: int
        default: 0
        required: false
        explode: true
        schema: {}
      - name: limit
        in: query
        description: List return limit. Minimum 1, Maximum 100.
        type: int
        default: 10
        required: false
        explode: true
        schema: {}
      - name: dataDiscoveryJobType
        in: query
        description: Specify to return only jobs of a specific type. If not included, returns jobs of all types.
        type: int
        default: 1
        required: false
        explode: true
        schema: {}
      responses:
        '200':
          description: 'Successfully retrieved data discovery job statuses. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDiscoveryJobList'
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '204':
          description: No databases found for client org.
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '401':
          description: Invalid credentials provided
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        '404':
          description: Client organization not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            trackingID:
              schema:
                type: String
                description: Returns a tracking identification UUID for the request.
                example: 8cfa50b0-2f9e-52cf-b739-b0eab8e7c37f
        5xx:
          description: Failure servicing this request
