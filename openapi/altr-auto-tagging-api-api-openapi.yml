              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /report-url/{reportID}:
    get:
      security:
      - BasicAuth: []
      description: Get a report URL for a given report ID. This URL will only be valid for a short duration of time.
      tags:
      - Auto Tagging API
      summary: Get Auto Tagging Report URL.
      parameters:
      - description: Generate a URL to get this report ID.
        name: reportID
        in: path
        required: true
        schema:
          type: string
      - description: The format of the report.
        name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - csv
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reportstorage.GetReportURLOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
