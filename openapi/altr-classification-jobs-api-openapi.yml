          description: 'ConditionTypes specifies which evaluation passes to run for this job.

            Valid values: ROW_DATA, METADATA, COLUMN_LOCATION, GDLP, SNOWFLAKE_NATIVE,

            CONTENT_TYPE, DATA_LENGTH, COLUMN_SIZE, AMAZON_COMPREHEND.

            When absent (nil), derived from sample_strategy for backward compatibility;

            an explicitly empty list ([]) means "evaluate no targets" (every leaf

            auto-resolves evaluated=false). Stored as a DynamoDB List (not a String Set)

            so the empty case is representable — a String Set cannot be empty and would

            drop [] to absent. Readers unmarshal both List and legacy String Set into

            []string, so this is backward-compatible on read.'
          items:
            type: string
          type: array
          uniqueItems: false
        confirmed_by:
          description: 'ConfirmedBy is the actor who confirmed the report, stamped at AcceptReportConfirm

            so the detached report task can read it when advancing the carry-forward anchor.'
          type: string
        database_id:
          description: Standard job fields
          type: integer
        findings_count:
          description: 'D-13: total findings count stamped by process_report; no omitempty so 0 is distinguishable from missing'
          type: integer
        hitl_task_token:
          description: 'D-12: HITL Step Function task token; separate from task_id'
          type: string
        job_id:
          type: string
        job_type:
          $ref: '#/components/schemas/types.JobType'
        new_findings_count:
          description: 'NewFindingsCount is the number of is_new (column × classifier) leaves stamped

            by process_report on a carry-forward rerun — findings absent from the prior

            confirmed run. 0 on first runs and on reruns with nothing new (this field alone

            does NOT distinguish those two — whether a job is a rerun is signaled by

            CarryForwardFrom / parent_job_id). No omitempty so the count serializes as an

            explicit 0 rather than being dropped.'
          type: integer
        org_id:
          type: string
        parent_job_id:
          description: ParentJobID links a carry-forward rerun to the prior confirmed job whose decisions were carried forward.
          type: string
        pause_count:
          type: integer
        platform:
          description: '"snowflake" or "databricks"'
          type: string
        report_confirmed_at:
          description: RFC3339
          type: string
        report_status:
          $ref: '#/components/schemas/types.ReportStatus'
        repository:
          $ref: '#/components/schemas/types.Repository'
        requires_review:
          description: 'Review workflow fields

            RequiresReview opts the job into the HitL report gate: when true, report

            generation produces only the review substrate (findings_index.db + a private

            unfiltered full-report draft) and the consumable report is deferred until

            ConfirmReport runs with all findings decided. Defaults false → legacy

            generate-immediately behavior.'
          type: boolean
        retry_count:
          type: integer
        review_status:
          description: 'ReviewStatus is a DERIVED, never-stored projection of the gated review

            lifecycle for the jobs-list UI (dynamodbav:"-"). Populated at read time via

            DeriveReviewStatus. Richer presentation pills (needs-review vs in-review

            progress %, "re-confirm soon" staleness) are the frontend''s job, derived from

            the raw report_status / findings_count / new_findings_count / report_confirmed_at

            fields; this field only exposes the phase the engine authoritatively knows.'
          type: string
        sample_size:
          type: integer
        sample_strategy:
          type: string
        sample_type:
          type: string
        service_user:
          $ref: '#/components/schemas/types.ServiceUser'
        started_at:
          description: Time is always stored RFC3339
          type: string
        status:
          $ref: '#/components/schemas/gitlab_ch5_altr_com_altrdb_altr-classification-engine_pkg_management_types.JobStatus'
        task_id:
          type: string
        updated_at:
          description: Time is always stored RFC3339
          type: string
      type: object
