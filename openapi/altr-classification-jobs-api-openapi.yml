      description: 'Records an approve or reject decision for a job. A decision targets an object path (database, schema, table, column — contiguous from the database down) and may additionally narrow to a single classifier via classifier_name, an optional filter at any object level. Examples: {database} approves every classifier under the database; {database, classifier_name} approves one classifier across the whole database; {database, schema, table, column, classifier_name} is the match scope. Read-time precedence is two-dimensional: deeper object wins, and at the same object level a classifier-scoped decision beats an all-classifier one. If a decision already exists at the same scope it is overwritten (last-write-wins).'
