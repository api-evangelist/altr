    types.ConditionResult:
      properties:
        actual_column_size:
          description: 'ActualColumnSize is the column''s actual declared size from schema metadata.

            Present only when evaluated=true.'
          example: 255
          type: integer
        actual_confidence:
          description: 'ActualConfidence is the Snowflake confidence tier (HIGH/MEDIUM/LOW) from

            EXTRACT_SEMANTIC_CATEGORIES for the column. Emitted whenever the

            SNOWFLAKE_NATIVE leaf evaluated (snowflakeTagsAvailable=true). Absent

            (omitempty) when not evaluated — legacy consumers ignore it.'
          example: HIGH
          type: string
        actual_content_format:
          $ref: '#/components/schemas/types.ContentFormat'
        actual_coverage:
          description: 'ActualCoverage is the Snowflake coverage ratio (0.0–1.0) from

            EXTRACT_SEMANTIC_CATEGORIES for the column. Emitted alongside

            ActualConfidence whenever the SNOWFLAKE_NATIVE leaf evaluated. Absent

            (omitempty / zero) when not evaluated.'
          example: 1
          type: number
        actual_format_ratio:
          type: number
        actual_likelihood:
          description: 'Actual-value fields for GDLP leaves (omitempty — absent when not set or not evaluated).

            ActualLikelihood is the highest likelihood detected for this infoType in the column''s

            findings (e.g. "VERY_LIKELY"). NOT the minimum threshold — the actual observed value.'
          example: VERY_LIKELY
          type: string
        actual_privacy_category:
          example: IDENTIFIER
          type: string
        actual_score:
          description: 'ActualScore is the maximum confidence (0..1) Comprehend returned for this entity type

            over the sampled column. Emitted on every evaluated leaf as evidence — including

            result=false leaves — so the actual-vs-minimum gap is visible. 0 when the entity was

            not detected (finding_count == 0).'
          example: 0.998
          maximum: 1
          minimum: 0
          type: number
        actual_semantic_category:
          description: 'Actual-value fields for SNOWFLAKE_NATIVE leaves (omitempty — absent when not set

            or not evaluated). ActualSemanticCategory and ActualPrivacyCategory carry the tag

            values Snowflake actually emitted for the column, regardless of which side(s) the

            condition spec checked. Empty when SF emitted no tag of that type for the column.'
          example: EMAIL
          type: string
        children:
          items:
            $ref: '#/components/schemas/types.ConditionResult'
          type: array
          uniqueItems: false
        comparator:
          example: matches
          type: string
        comprehend_classifier:
          description: 'ComprehendClassifier denormalizes the detected entity type (mirrors entity_type) for

            report consumers. Present only when the entity was actually detected (finding_count > 0).'
          example: EMAIL
          type: string
        comprehend_score:
          description: 'ComprehendScore denormalizes the detected confidence (mirrors actual_score). Present

            only when the entity was actually detected (finding_count > 0).'
          example: 0.998
          maximum: 1
          minimum: 0
          type: number
        content_format:
          $ref: '#/components/schemas/types.ContentFormat'
        content_formats:
          items:
            $ref: '#/components/schemas/types.ContentFormat'
          type: array
          uniqueItems: false
        dominance_threshold:
          type: number
        entity_type:
          description: 'AMAZON_COMPREHEND leaf spec fields (present when Target == AMAZON_COMPREHEND).

            EntityType is the Comprehend PII entity type the leaf tests against (e.g. "EMAIL").'
          example: EMAIL
          type: string
        evaluated:
          example: true
          type: boolean
        finding_count:
          description: 'FindingCount is the number of findings detected in the column: GDLP infoType matches,

            or Comprehend Detect PII entities for an AMAZON_COMPREHEND leaf. Emitted on every

            evaluated external-detector leaf (0 when nothing was detected).'
          example: 100
          minimum: 0
          type: integer
        info_type:
          example: EMAIL_ADDRESS
          type: string
        length:
          description: 'DATA_LENGTH leaf spec fields (present when Target == DATA_LENGTH).

            Comparator (shared field above) carries the length comparator. Length is

            the byte-length cutoff; Trim reports whether surrounding whitespace was

            stripped before measuring; MinimumThreshold (shared semantics with

            ROW_DATA) is the percent of sampled values that must satisfy the

            comparison. Actuals reuse MatchCount / TotalCount / MatchRatio above.'
          example: 100
          type: integer
        location:
          $ref: '#/components/schemas/types.ColumnLocation'
        match_count:
          description: 'Actual-value fields for ROW_DATA leaves (omitempty — absent when not set or not evaluated).

            MatchCount is the number of sampled rows whose value matched the regex pattern.'
          type: integer
        match_ratio:
          description: MatchRatio is MatchCount/TotalCount as a value in [0.0, 1.0].
          type: number
        minimum_confidence:
          description: 'MinimumConfidence is the confidence gate applied on this leaf (HIGH/MEDIUM/LOW).

            Mirrors MinimumLikelihood for GDLP leaves. Reflects either the user-specified

            value or the engine default ("LOW") when Snowflake emitted a confidence

            signal. Absent (omitempty) when no gate applied (no signal from Snowflake).'
          example: HIGH
          type: string
        minimum_coverage:
          description: 'MinimumCoverage is the coverage gate applied on this leaf (0.0-1.0).

            Mirrors MinimumMatchRatio for ROW_DATA leaves. Reflects either the

            user-specified value or the engine default (0.70) when Snowflake emitted

            a coverage value. Absent (omitempty / zero) when no gate applied.'
          example: 0.7
          type: number
        minimum_likelihood:
          example: LIKELY
          type: string
        minimum_match_ratio:
          description: 'MinimumMatchRatio is the classifier-level threshold required for this ROW_DATA condition

            to pass (0.0–1.0). Parallels MinimumLikelihood for GDLP leaves. Absent when not applicable

            (e.g. Snowflake GDLP path where ROW_DATA leaves are auto-resolved with evaluated=false).'
          type: number
        minimum_score:
          description: 'MinimumScore is the minimum confidence (0..1) a finding must reach for the leaf to

            pass. Defaults to 0.5 when omitted or zero.'
          example: 0.5
          maximum: 1
          minimum: 0
          type: number
        minimum_threshold:
          example: 80
          type: number
        negated:
          example: false
          type: boolean
        operator:
          $ref: '#/components/schemas/types.ConditionOperator'
        pattern:
          example: (?i)\\d{3}-\\d{2}-\\d{4}
          type: string
        privacy_category:
          example: IDENTIFIER
          type: string
        result:
          example: true
          type: boolean
        semantic_category:
          description: SNOWFLAKE_NATIVE leaf spec fields — the threshold side of the condition.
          example: EMAIL
          type: string
        size:
          description: 'COLUMN_SIZE leaf spec fields (present when Target == COLUMN_SIZE).

            Comparator (shared field above) carries the size comparator. Size is

            the declared-size cutoff. Binary per-column: no match/total/ratio actuals.'
          example: 100
          type: integer
        tags:
          description: 'Tags echoes the authored tags of the underlying condition node so the

            lineage tree is self-describing. Contribution to the classifier-level

            matched_tags is governed by ComputeMatchedTags, not by mere presence here.'
          example:
          - type:ssn
          items:
            type: string
          type: array
          uniqueItems: false
        target:
          $ref: '#/components/schemas/types.ConditionTarget'
        total_count:
          description: TotalCount is the total number of sampled rows evaluated against the regex pattern.
          type: integer
        trim:
          example: true
          type: boolean
        type:
          $ref: '#/components/schemas/types.ConditionResultType'
      type: object
    types.JobItem:
      properties:
        agent_id:
