  ? /jobs/{job_id}/findings/databases/{database}/schemas/{schema}/tables/{table}/columns/{column}/classifiers/{classifier_name}/lineage
  : get:
      description: 'Returns the per-(column, classifier) compound-ruleset evaluation tree (types.DecisionLineage): the top-level operator (AND/OR) and result, and the recursive condition results carrying each condition''s target (ROW_DATA / GDLP / METADATA / COLUMN_LOCATION / SNOWFLAKE_NATIVE / CONTENT_TYPE), evaluated/result/negated flags, and the actual-observed vs threshold evidence (match_count/total_count/match_ratio vs minimum_match_ratio; actual_likelihood vs minimum_likelihood; actual_confidence/actual_coverage vs gates). A finding with no lineage tree (simple non-compound classifier, or an artifact predating lineage persistence) returns 200 with decision_lineage null. Lineage is only available for reports generated after lineage persistence shipped, or after a report regeneration (POST /jobs/{job_id}/report).'
      parameters:
      - description: Job ID
        in: path
        name: job_id
        required: true
        schema:
          type: string
      - description: Database name (URL-encoded; characters /, =, spaces, unicode all supported)
        in: path
        name: database
        required: true
        schema:
          type: string
      - description: Schema name (URL-encoded; characters /, =, spaces, unicode all supported)
        in: path
        name: schema
        required: true
        schema:
          type: string
      - description: Table name (URL-encoded; characters /, =, spaces, unicode all supported)
        in: path
        name: table
        required: true
        schema:
          type: string
      - description: Column name (URL-encoded; characters /, =, spaces, unicode all supported)
        in: path
        name: column
        required: true
        schema:
          type: string
      - description: Classifier name (URL-encoded; characters /, =, spaces, unicode all supported)
        in: path
        name: classifier_name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.GetFindingLineageOutput'
          description: 'Decision lineage tree, or {\"decision_lineage\": null} when the finding has no lineage'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Invalid path segments
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: No classification report available, or no such finding
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Internal server error
      security:
      - basic: []
      summary: Get a finding's decision lineage
      tags:
      - Classification Jobs
  /jobs/{job_id}/report:
    post:
      description: Creates a new classification job report for a specific job.
      parameters:
      - description: Job ID (UUID v4)
        in: path
        name: job_id
        required: true
        schema:
          type: string
      - description: Desired report format (application/json, application/gzip, application/x-sqlite3, application/x-sqlite3+gzip)
        in: header
        name: Accept
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.GetS3PresignedURLOutput'
          description: Job report created successfully
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Job not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Internal server error
      security:
      - basic: []
      summary: Create classification job report
      tags:
      - Classification Jobs
  /jobs/{job_id}/report/cancel:
    post:
      description: Cancels a review-gated job (created with requires_review=true) while it is still in the review lifecycle (PROCESSING_FINDINGS or AWAITING_REVIEW), transitioning the job to CANCELLED and reclaiming its review substrate. Rejects a job whose confirm has already been accepted (PROCESSING_REPORT), a terminal job, or a non-gated job. The report-scoped counterpart to POST /jobs/{job_id}/report/confirm.
      parameters:
      - description: Job ID
        in: path
        name: job_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.JobItem'
          description: Job cancelled
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Job not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Report not in a cancellable review state
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Internal server error
      security:
      - basic: []
      summary: Cancel a job's report
      tags:
      - Classification Jobs
  /jobs/{job_id}/report/confirm:
    post:
      description: Accepts confirmation for a review-gated job (created with requires_review=true). Verifies every finding has a decision, then queues async generation of the consumable report (rejected object × classifier findings excluded) by transitioning the job to PROCESSING_REPORT. Returns 202 immediately; clients poll job status until COMPLETED, at which point report_status is confirmed. Only valid while the report is in_review; once accepted, decisions are locked.
      parameters:
      - description: Job ID
        in: path
        name: job_id
        required: true
        schema:
          type: string
      responses:
        '202':
          content:
            application/json: {}
          description: Confirm accepted; report generation queued
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Job not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Report not finalizable, already confirmed, or findings not fully decided
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Internal server error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Decision count too large to aggregate; retry later
      security:
      - basic: []
      summary: Confirm a job's report
      tags:
      - Classification Jobs
  /jobs/{job_id}/review-status:
    get:
      description: Returns total/approved/rejected/pending counts for the job's review progress. approved/rejected are FINDINGS covered by decisions (resolved through the most-specific-wins decision cascade), not raw decision counts — an object-scope decision covers every finding beneath it. Counts come from the materialized findings-index rollups (no full scan).
      parameters:
      - description: Job ID
        in: path
        name: job_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/management.ReviewStatusOutput'
          description: Review status counts
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Job not found
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Internal server error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Decision count too large to aggregate; retry later or contact support
      security:
      - basic: []
      summary: Get review progress for a job
      tags:
      - Classification Jobs
  /jobs/{job_id}/summary:
    get:
      description: Returns the per-classifier counts and column totals for a job. Equivalent to the data in summary.json but delivered inline as a snake_case JSON body so callers do not need to follow a presigned URL. For an HitL-gated job (`requires_review`) still awaiting confirmation, the summary is derived from the review substrate so it is available before the report is confirmed — its counts are UNFILTERED (they reflect the full scan, not the post-confirm decision-filtered report). The legacy presigned-URL flow on POST /jobs/{job_id}/report continues to work for backwards compatibility.
      parameters:
      - description: Job ID
        in: path
        name: job_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.ReportSummary'
          description: Classification summary
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Validation failure
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Summary not available (job not yet processed or job does not exist)
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Internal server error
      security:
      - basic: []
      summary: Get classification summary for a job
      tags:
      - Classification Jobs
  /jobs/{job_id}/upload:
    put:
      description: Uploads a chunk of classification results for a specific job. The request body contains a "records" array of classification results and a chunk_index for ordering.
      parameters:
      - description: Job ID (UUID v4)
        in: path
        name: job_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jobs.UploadJobResultsBody'
            examples:
              GDLP BYOK — with decision lineage (percolation fields populated):
                summary: Upload chunk showing a GDLP+METADATA compound classifier result with actual_likelihood, finding_count (GDLP leaf) and evaluated=false for auto-resolved COLUMN_LOCATION condition
                value:
                  chunk_index: 0
                  records:
                  - classifier_name: email_gdlp_compound
                    classified: true
                    column_name: customer_email
                    schema_name: public
                    table_name: customers
                    database_name: prod_db
                    fully_qualified_name: prod_db.public.customers.customer_email
                    match_percentage: 0.95
                    matched_rows: 95
                    total_rows: 100
                    sample_size: 100
                    decision_lineage:
                      classifier_name: email_gdlp_compound
                      operator: AND
                      result: true
                      conditions:
                      - type: leaf
                        target: GDLP
                        info_type: EMAIL_ADDRESS
                        minimum_likelihood: POSSIBLE
                        result: true
                        evaluated: true
                        actual_likelihood: VERY_LIKELY
                        finding_count: 47
                      - type: leaf
                        target: METADATA
                        comparator: matches
                        pattern: (?i)email|e_mail|mail_addr
                        result: true
                        evaluated: true
                      - type: leaf
                        target: COLUMN_LOCATION
                        location:
                          schema: pii
                        result: false
                        evaluated: false
              Snowflake Native — SEMANTIC_CATEGORY lineage:
                summary: Report chunk showing a SNOWFLAKE_NATIVE compound match with actual_semantic_category populated
                value:
                  chunk_index: 0
                  records:
                  - classifier_name: snowflake_native_email
                    classified: true
                    column_name: customer_email
                    schema_name: public
                    table_name: customers
                    database_name: prod_db
                    fully_qualified_name: prod_db.public.customers.customer_email
                    match_percentage: 0
                    matched_rows: 0
                    total_rows: 0
                    sample_size: 0
                    decision_lineage:
                      classifier_name: snowflake_native_email
                      operator: AND
                      result: true
                      conditions:
                      - type: leaf
                        target: SNOWFLAKE_NATIVE
                        semantic_category: EMAIL
                        result: true
                        evaluated: true
                        actual_semantic_category: EMAIL
                        actual_privacy_category: IDENTIFIER
                        actual_confidence: HIGH
                        actual_coverage: 0.92
                        minimum_confidence: LOW
                        minimum_coverage: 0.7
              ALTR Native — SNOWFLAKE_NATIVE auto-resolved on OLTP source:
                summary: OLTP-agent (non-Snowflake) report chunk where a SNOWFLAKE_NATIVE leaf was auto-resolved to evaluated=false (no SF tags available)
                value:
                  chunk_index: 0
                  records:
                  - classifier_name: email_snowflake_or_name
                    classified: true
                    column_name: email_addr
                    schema_name: public
                    table_name: users
                    database_name: hr_db
                    fully_qualified_name: hr_db.public.users.email_addr
                    match_percentage: 0
                    matched_rows: 0
                    total_rows: 0
                    sample_size: 0
                    decision_lineage:
                      classifier_name: email_snowflake_or_name
                      operator: OR
                      result: true
                      conditions:
                      - type: leaf
                        target: SNOWFLAKE_NATIVE
                        semantic_category: EMAIL
                        result: false
                        evaluated: false
                      - type: leaf
                        target: METADATA
                        comparator: matches
                        pattern: (?i)email|e_mail|mail_addr
                        result: true
                        evaluated: true
              SF GDLP — cross-target lineage (GDLP + SNOWFLAKE_NATIVE both evaluated):
                summary: Snowflake GDLP report chunk showing a hybrid compound where BOTH the GDLP leaf and the SNOWFLAKE_NATIVE leaf evaluated against real data on the same job. The GDLP leaf carries actual_likelihood + finding_count from Google DLP; the SNOWFLAKE_NATIVE leaf carries actual_semantic_category + actual_privacy_category fetched from INFORMATION_SCHEMA.TAG_REFERENCES_ALL_COLUMNS during the worker's sample pass.
                value:
                  chunk_index: 0
                  records:
                  - classifier_name: email_gdlp_and_snowflake_native
                    classified: true
                    column_name: customer_email
                    schema_name: public
                    table_name: customers
                    database_name: prod_sf_db
                    fully_qualified_name: prod_sf_db.public.customers.customer_email
                    match_percentage: 0
                    matched_rows: 0
                    total_rows: 0
                    sample_size: 0
                    decision_lineage:
                      classifier_name: email_gdlp_and_snowflake_native
                      operator: AND
                      result: true
                      conditions:
                      - type: leaf
                        target: GDLP
                        info_type: EMAIL_ADDRESS
                        minimum_likelihood: POSSIBLE
                        result: true
                        evaluated: true
                        actual_likelihood: VERY_LIKELY
                        finding_count: 47
                      - type: leaf
                        target: SNOWFLAKE_NATIVE
                        semantic_category: EMAIL
                        result: true
                        evaluated: true
                        actual_semantic_category: EMAIL
                        actual_privacy_category: IDENTIFIER
              SF GDLP — all five condition targets in one lineage:
                summary: Snowflake GDLP report chunk where a single compound spans all five condition targets. GDLP + METADATA + SNOWFLAKE_NATIVE + COLUMN_LOCATION evaluate; ROW_DATA auto-resolves with evaluated=false (no row sampling on the SF GDLP path) and is vacuous-true under AND.
                value:
                  chunk_index: 0
                  records:
                  - classifier_name: ssn_all_five_targets
                    classified: true
                    column_name: social_security_number
                    schema_name: hr
                    table_name: employees
                    database_name: prod_sf_db
                    fully_qualified_name: prod_sf_db.hr.employees.social_security_number
                    match_percentage: 0
                    matched_rows: 0
                    total_rows: 0
                    sample_size: 0
                    decision_lineage:
                      classifier_name: ssn_all_five_targets
                      operator: AND
                      result: true
                      conditions:
                      - type: leaf
                        target: ROW_DATA
                        comparator: matches
                        pattern: \d{3}-\d{2}-\d{4}
                        result: true
                        evaluated: false
                      - type: leaf
                        target: METADATA
                        comparator: matches
                        pattern: (?i)ssn|social_security
                        result: true
                        evaluated: true
                      - type: leaf
                        target: COLUMN_LOCATION
                        location:
                          schema: hr
                        result: true
                        evaluated: true
                      - type: leaf
                        target: GDLP
                        info_type: US_SOCIAL_SECURITY_NUMBER
                        minimum_likelihood: LIKELY
                        result: true
                        evaluated: true
                        actual_likelihood: VERY_LIKELY
                        finding_count: 19
                      - type: leaf
                        target: SNOWFLAKE_NATIVE
                        semantic_category: US_SOCIAL_SECURITY_NUMBER
                        result: true
                        evaluated: true
                        actual_semantic_category: US_SOCIAL_SECURITY_NUMBER
                        actual_privacy_category: IDENTIFIER
              ALTR Native — ROW_DATA with match_count/match_ratio:
                summary: Upload chunk showing a ROW_DATA leaf with score-percolation fields (match_count, total_count, match_ratio)
                value:
                  chunk_index: 0
                  records:
                  - classifier_name: ssn_compound
                    classified: true
                    column_name: ssn
                    schema_name: pii
                    table_name: employees
                    database_name: hr_db
                    fully_qualified_name: hr_db.pii.employees.ssn
                    match_percentage: 0.65
                    matched_rows: 13
                    total_rows: 20
                    sample_size: 20
                    decision_lineage:
                      classifier_name: ssn_compound
                      operator: AND
                      result: true
                      conditions:
                      - type: leaf
                        target: ROW_DATA
                        comparator: matches
                        pattern: \d{3}-\d{2}-\d{4}
                        result: true
                        evaluated: true
                        match_count: 13
                        total_count: 20
                        match_ratio: 0.65
                      - type: leaf
                        target: METADATA
                        comparator: matches
                        pattern: (?i)ssn|social_security
                        result: true
                        evaluated: true
              CONTENT_TYPE — positive match with actual_content_format / actual_format_ratio:
                summary: Upload chunk showing a CONTENT_TYPE leaf that evaluated against the agent-detected dominant content format. actual_content_format and actual_format_ratio carry the evidence used to resolve the leaf.
                value:
                  chunk_index: 0
                  records:
                  - classifier_name: structured_payload
                    classified: true
                    column_name: request_body
                    schema_name: audit
                    table_name: api_log
                    database_name: telemetry_db
                    fully_qualified_name: telemetry_db.audit.api_log.request_body
                    match_percentage: 1.0
                    matched_rows: 100
                    total_rows: 100
                    sample_size: 100
                    decision_lineage:
                      classifier_name: structured_payload
                      operator: OR
                      result: true
                      conditions:
                      - type: leaf
                        target: CONTENT_TYPE
                        content_formats:
                        - JSON
                        - XML
                        - YAML
                        dominance_threshold: 0.6
                        negated: false
                        result: true
                        evaluated: true
                        actual_content_format: JSON
                        actual_format_ratio: 1.0
              Amazon Comprehend — decision lineage (entity_type + actual_score + comprehend_classifier):
                summary: Report chunk showing an AMAZON_COMPREHEND compound match. The AC leaf carries entity_type + minimum_score (spec) and actual_score + finding_count + comprehend_classifier + comprehend_score (evidence) aggregated from AWS Comprehend's DetectPiiEntities findings over the column's sampled values. actual_score is the max confidence observed for the entity; comprehend_classifier/comprehend_score mirror entity_type/actual_score for denormalized report consumers.
                value:
                  chunk_index: 0
                  records:
                  - classifier_name: ssn_comprehend_and_name
                    classified: true
                    column_name: ssn
                    schema_name: pii
                    table_name: employees
                    database_name: hr_db
                    fully_qualified_name: hr_db.pii.employees.ssn
                    match_percentage: 0
                    matched_rows: 0
                    total_rows: 0
                    sample_size: 100
                    decision_lineage:
                      classifier_name: ssn_comprehend_and_name
                      operator: AND
                      result: true
                      conditions:
                      - type: leaf
                        target: AMAZON_COMPREHEND
                        entity_type: SSN
                        minimum_score: 0.8
                        result: true
                        evaluated: true
                        actual_score: 0.99
                        finding_count: 92
                        comprehend_classifier: SSN
                        comprehend_score: 0.99
                      - type: leaf
                        target: METADATA
                        comparator: matches
                        pattern: (?i)ssn|social_security
                        result: true
                        evaluated: true
        description: Classification results chunk
        required: true
      responses:
        '201':
          description: Results uploaded successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Invalid request body
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.APIError'
          description: Internal server error
      security:
      - basic: []
      summary: Upload classification results
      tags:
      - Classification Jobs
components:
  schemas:
    types.DecisionLineage:
      properties:
        classifier_name:
          example: ssn_compound
          type: string
        conditions:
          items:
            $ref: '#/components/schemas/types.ConditionResult'
          type: array
          uniqueItems: false
        effective_tags:
          description: 'EffectiveTags is the deduplicated, sorted union of MatchedTags with the

            classifier''s static attribute tags (attributes.tags — a tier is an

            ordinary "tier:<value>" attribute tag). This is the single canonical tag set a

            consumer should read — matched_tags carries only condition-node evidence,

            while classifier-level attributes never appear there. Empty when the

            classifier did not fire. See ComputeEffectiveTags.'
          example:
          - tier:red
          items:
            type: string
          type: array
          uniqueItems: false
        matched_tags:
          description: 'MatchedTags is the deduplicated, sorted union of tags from every condition

            node that contributed to a true overall result. Empty when the classifier

            did not fire or no contributing node carries tags. See ComputeMatchedTags

            for the exact contribution rules.'
          example:
          - type:ssn
          items:
            type: string
          type: array
          uniqueItems: false
        operator:
          $ref: '#/components/schemas/types.ConditionOperator'
        result:
          example: true
          type: boolean
      type: object
    types.ConditionTarget:
      description: 'Leaf fields (present when type is "leaf").

        For ROW_DATA / METADATA / COLUMN_LOCATION targets: Target + Comparator + Pattern + Location.

        For GDLP target: Target + InfoType + MinimumLikelihood (Comparator/Pattern/Location are unused).

        For SNOWFLAKE_NATIVE target: Target + SemanticCategory and/or PrivacyCategory

        (Comparator/Pattern/Location/InfoType/MinimumLikelihood are unused).'
      enum:
      - ROW_DATA
      - METADATA
      - COLUMN_LOCATION
      - GDLP
      - SNOWFLAKE_NATIVE
      - CONTENT_TYPE
      - DATA_LENGTH
      - COLUMN_SIZE
      - AMAZON_COMPREHEND
      example: ROW_DATA
      type: string
      x-enum-varnames:
      - ConditionTargetRowData
      - ConditionTargetMetadata
      - ConditionTargetColumnLocation
      - ConditionTargetGDLP
      - ConditionTargetSnowflakeNative
      - ConditionTargetContentType
      - ConditionTargetDataLength
      - ConditionTargetColumnSize
      - ConditionTargetComprehend
    types.GetFindingsTreeTablesOutput:
      properties:
        items:
          items:
            $ref: '#/components/schemas/types.FindingsTreeTableItem'
          type: array
          uniqueItems: false
        next_page_token:
          type: string
      type: object
    reportgenerator.OLTPClassificationRecord:
      properties:
        classified:
          type: boolean
        classifier_name:
          type: string
        classifier_threshold:
          type: number
        column_name:
          type: string
        column_size:
          description: 'ColumnSizeVal is the agent-decorated declared column size from schema

            metadata. Nil when unavailable (e.g. types with no declared length).

            Named ColumnSizeVal to avoid collision with the maximum_length field.'
          type: integer
        content_format:
          description: 'ContentFormat is the agent-decorated dominant content-type for this column

            (JSON/XML/HTML/YAML/CSV/BASE64/PLAIN_TEXT). Empty when the agent had no

            sample data (metadata-only sampling).'
          type: string
        content_format_ratio:
          description: 'ContentFormatRatio is the winning-format frequency in [0.0, 1.0]. Nil when

            ContentFormat is empty.'
          type: number
        created_at:
          type: string
        data_type:
          type: string
        database_name:
          type: string
        decision_lineage:
          $ref: '#/components/schemas/types.DecisionLineage'
        fully_qualified_name:
          type: string
        gdlp_classifier:
          type: string
        gdlp_likelihood:
          type: string
        id:
          type: integer
        match_percentage:
          type: number
        matched_rows:
          type: integer
        maximum_length:
          type: integer
        regex_pattern:
          type: string
        sample_size:
          type: integer
        sample_type:
          type: string
        schema_name:
          type: string
        table_name:
          type: string
        total_rows:
          type: integer
        updated_at:
          type: string
      type: object
    types.AzureKeyVault:
      properties:
        key_vault_uri:
          type: string
        secret_name:
          type: string
      required:
      - key_vault_uri
      - secret_name
      type: object
    decisions.DeleteDecisionInput:
      properties:
        classifier_name:
          example: pii-detector
          type: string
          x-order: E
        column:
          example: email
          type: string
          x-order: D
        database:
          example: mydb
          type: string
          x-order: A
        schema:
          example: public
          type: string
          x-order: B
        table:
          example: users
