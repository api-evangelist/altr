    required:
    - end
    - start
    properties:
      end:
        type: string
      start:
        type: string
  auditfilter.Dimension:
    type: string
    enum:
    - user
    - database
    - schema
    - table
    - column
    - statement_type
    - statement_text
    - event_name
    - time_of_day
    - query_status
    - repo_user
    - client_ip
    - client_app
    - client_port
    - repo_type
    - repo_host
    - sidecar_id
    - connection_authorized
    - authorization_type
    - oltp_row_count
    - bytes_returned
    - policy_applied
    - policy_type
    - user_email
    - user_group
    - snowflake_role
    - snowflake_roles
    - snowflake_warehouse
    - snowflake_warehouse_size
    - snowflake_ip_address
    - snowflake_client
    - snowflake_session_id
    - snowflake_query_tag
    - snowflake_row_count
    - snowflake_account
    - snowflake_account_region
    - snowflake_masking_policy
    - snowflake_column_policy
    - snowflake_execution_duration
    - snowflake_tag_name
    - snowflake_tag_value
    x-enum-varnames:
    - DimUser
    - DimDatabase
    - DimSchema
    - DimTable
    - DimColumn
    - DimStatementType
    - DimStatementText
    - DimEventName
    - DimTimeOfDay
    - DimQueryStatus
    - DimRepoUser
    - DimClientIP
    - DimClientApp
    - DimClientPort
    - DimRepoType
    - DimRepoHost
    - DimSidecarID
    - DimConnectionAuthorized
    - DimAuthorizationType
    - DimRowCount
    - DimBytesReturned
    - DimPolicyApplied
    - DimPolicyType
    - DimUserEmail
    - DimUserGroup
    - DimSnowflakeRole
    - DimSnowflakeRoles
    - DimSnowflakeWarehouse
    - DimSnowflakeWarehouseSize
    - DimSnowflakeIPAddress
    - DimSnowflakeClient
    - DimSnowflakeSessionID
    - DimSnowflakeQueryTag
    - DimSnowflakeRowCount
    - DimSnowflakeAccount
    - DimSnowflakeAccountRegion
    - DimSnowflakeMaskingPolicy
    - DimSnowflakeColumnPolicy
    - DimSnowflakeExecutionDuration
    - DimSnowflakeTagName
    - DimSnowflakeTagValue
  auditfilter.KeyEqValue:
    type: object
    required:
    - key
    - value
    properties:
      key:
        type: string
        maxLength: 256
      value:
        type: string
        maxLength: 256
  auditfilter.Op:
    type: string
    enum:
    - and
    - or
    - eq
    - neq
    - in
    - contains
    - regex
    - cidr
    - gt
    - gte
    - lt
    - lte
    - range
    - between
    - exists
    - key_exists
    - key_eq
    x-enum-varnames:
    - OpAnd
    - OpOr
    - OpEq
    - OpNeq
    - OpIn
    - OpContains
    - OpRegex
    - OpCIDR
    - OpGt
    - OpGte
    - OpLt
    - OpLte
    - OpRange
    - OpBetween
    - OpExists
    - OpKeyExists
    - OpKeyEq
  auditfilter.RangeValue:
    type: object
    required:
    - max
    - min
    properties:
      max:
        type: number
      min:
        type: number
  main.FilterNodeDoc:
    type: object
    required:
    - op
    properties:
      between:
        $ref: '#/definitions/auditfilter.BetweenValue'
      children:
        description: 'Children is required for op=and|or. Each entry is a nested FilterNode

          with the same shape as this object. Typed as []object here only to break

          the recursive $ref that older Swagger UI cannot resolve.'
        type: array
        items:
          type: object
          additionalProperties: {}
      dimension:
        $ref: '#/definitions/auditfilter.Dimension'
      key_eq:
        $ref: '#/definitions/auditfilter.KeyEqValue'
      list_value:
        type: array
        minItems: 1
        items:
          type: string
      number_value:
        type: number
      op:
        $ref: '#/definitions/auditfilter.Op'
      range:
        $ref: '#/definitions/auditfilter.RangeValue'
      string_value:
        type: string
        maxLength: 1024
  main.GetResultOutput:
    type: object
    properties:
      next_page_token:
        description: Token to retrieve the next page of results. If not present, there are no more results.
        type: string
        x-order: '0'
      query_audits:
        description: Query audits.
        type: array
        items:
          $ref: '#/definitions/management.QueryAudit'
        x-order: '1'
  main.SearchRequestDoc:
    type: object
    properties:
      filter:
