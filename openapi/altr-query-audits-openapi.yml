schemes: []
swagger: '2.0'
info:
  description: 'The Query Audits API is used to get query audits generated by ALTR.

    ALTR generates a query audit when a query that accesses governed data is executed.'
  title: Query Audits API
  contact: {}
  version: 1.1.0
host: api.live.altr.com/v1
basePath: /query-audits
paths:
  /results/{search_uuid}:
    get:
      security:
      - BasicAuth: []
      description: This endpoint retrieves the results of a search using the `search_uuid` provided by the /search endpoint.
        The results are paginated and can be retrieved using the `next_page_token` provided in the response.
      produces:
      - application/json
      tags:
      - Query Audits API
      summary: Get the results of a search using the `search_uuid`.
      parameters:
      - type: string
        example: 123e4567-e89b-12d3-a456-426614174000
        description: '`search_uuid` received by /search endpoint.'
        name: search_uuid
        in: path
        required: true
      - type: string
        example: ARpLpuKth8RwkdlQA2ktpaV/uJoOyM1EKldHyjKTLbagIrIWP1PLXiO67UyWew==
        description: The token to retrieve the next page of results.
        name: next_page_token
        in: query
      - maximum: 250
        minimum: 1
        type: integer
        default: 250
        description: Limit the number of results returned.
        name: limit
        in: query
      responses:
        '200':
          description: Search complete. Results are ready.
          schema:
            $ref: '#/definitions/main.GetResultOutput'
        '202':
          description: Search not complete. Results are not ready.
          schema:
            $ref: '#/definitions/main.GetResultOutput'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Search UUID not found.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
  /search:
    post:
      security:
      - BasicAuth: []
      description: 'This endpoint triggers a search for query audits. Chaining query parameter filters as `AND` operations.

        The `search_uuid` that is returned expires after 30 days.'
      produces:
      - application/json
      tags:
      - Query Audits API
      summary: Trigger search using various filters.
      parameters:
      - maximum: 100000
        minimum: 1
        type: integer
        default: 10000
        description: The maximum number of items to return.
        name: limit
        in: query
      - minimum: 0
        type: integer
        default: 0
        description: The number of items to skip.
        name: offset
        in: query
      - type: string
        example: '2024-11-23T17:51:35.000Z'
        description: Queries that ended before this time will not be returned. Must be provided as a UTC timestamp in valid
          RFC3339 format. Default is 24 hours ago.
        name: from_date_time
        in: query
      - type: string
        example: '2024-11-24T17:51:35.000Z'
        description: Queries that ended after this time will not be returned. Must be provided as a UTC timestamp in valid
          RFC3339 format. Default is now.
        name: to_date_time
        in: query
      - type: string
        example: BI_SERVICE_ROLE
        description: The role that executed the query. Case-insensitive.
        name: executing_role
        in: query
      - type: string
        example: BI_SERVICE_USER
        description: The user that executed the query. Case-insensitive.
        name: executing_user
        in: query
      - type: string
        example: 01d89caa-080e-3b34-0000-se59220b6656
        description: The ID of the query. Case-insensitive.
        name: query_id
        in: query
      - type: string
        example: PII_TAG
        description: The policy tag name to filter by. Case-insensitive.
        name: policy_tag_name
        in: query
      - type: string
        example: EMAIL
        description: The policy tag value to filter by. Case-insensitive.
        name: policy_tag_value
        in: query
      - type: string
        example: EXAMPLE_DB
        description: The policy column database name to filter by. Case-insensitive.
        name: policy_column_database_name
        in: query
      - type: string
        example: EXAMPLE_SCHEMA
        description: The policy column schema name to filter by. Case-insensitive.
        name: policy_column_schema_name
        in: query
      - type: string
        example: EXAMPLE_TABLE
        description: The policy column table name to filter by. Case-insensitive.
        name: policy_column_table_name
        in: query
      - type: string
        description: The policy column name to filter by. Case-insensitive.
        name: policy_column_name
        in: query
      - enum:
        - asc
        - desc
        type: string
        default: desc
        description: The order by clause for the query. Case-insensitive.
        name: order_by
        in: query
      - enum:
        - event_time
        - rows_accessed
        type: string
        default: event_time
        description: The column to sort by. Case-insensitive.
        name: sort_by
        in: query
      - description: Optional filter-tree expression body. The 'filter' field accepts the same audit-filter DSL used by dam-alerting
          threshold rules; when present it is AND-composed with the query-string filters above. Omit the body entirely for
          the legacy query-param-only behavior. The 'timezone' field (IANA name) is required when the filter contains a time_of_day
          dimension and forbidden otherwise. Children of and/or nodes are themselves FilterNode subtrees with the same shape;
          the docs flatten the inner level to a generic object to keep Swagger UI happy.
        name: request
        in: body
        schema:
          $ref: '#/definitions/main.SearchRequestDoc'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/management.TriggerSearchOutput'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
definitions:
  ErrorResponse:
    type: object
    properties:
      error:
        type: string
  auditfilter.BetweenValue:
