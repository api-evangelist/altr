        - **environment_variable** — read the credential from an OS environment variable (field: variable_name).

        - **secret_file** — read the credential from a file under /altr/secrets/ (field: path). The path must be a simple
        filename with no directory separators or traversal (e.g. "db_password" resolves to /altr/secrets/db_password). The
        file is re-read on every credential fetch, supporting live secret rotation. Mount your secrets directory to /altr/secrets/
        in the container.'
