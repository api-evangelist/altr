          type: integer
          x-order: '0'
      type: object
    sidecars.CreateSidecarInput:
      properties:
        description:
          maxLength: 400
          type: string
          x-order: '1'
        disable_platform_audits:
          description: 'DisablePlatformAudits

            When true, the sidecar will not send activity audits (connections and SQL statements) to the platform.'
          type: boolean
          x-order: '6'
        hostname:
          maxLength: 500
          type: string
          x-order: '2'
        name:
          maxLength: 64
          type: string
          x-order: '0'
        public_key_1:
          maxLength: 45000
          type: string
          x-order: '3'
        public_key_2:
          maxLength: 45000
          type: string
          x-order: '4'
        unsupported_query_bypass:
          description: 'UnsupportedQueryBypass

            When true, unsupported queries will bypass the query parser and return all results without applying policy instead
            of returning an error.'
          type: boolean
          x-order: '5'
      required:
      - hostname
      - name
      type: object
    sidecars.UpdateSidecarInput:
      properties:
        description:
          type: string
          x-order: '1'
        disable_platform_audits:
          description: 'DisablePlatformAudits

            When true, the sidecar will not send activity audits (connections and SQL statements) to the platform.'
          type: boolean
          x-order: '6'
        hostname:
          type: string
          x-order: '2'
        name:
          type: string
          x-order: '0'
        public_key_1:
          type: string
          x-order: '3'
        public_key_2:
          type: string
          x-order: '4'
        unsupported_query_bypass:
          description: 'UnsupportedQueryBypass

            When true, unsupported queries will bypass the query parser and return all results without applying policy instead
            of returning an error.'
          type: boolean
          x-order: '5'
      type: object
    tasks.CreateTaskInput:
      properties:
        configuration:
          $ref: '#/components/schemas/management.TaskConfiguration'
        description:
