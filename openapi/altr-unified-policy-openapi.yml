                            example: ORG#12e06dcd-8b2e-4102-82db-c8a692d87c52#POLICY
                          SK:
                            type: string
                            example: IMPERSONATION#97960564-65e8-48ff-a34c-542d3bbd0ac4
                          client_id:
                            type: string
                            example: 12e06dcd-8b2e-4102-82db-c8a692d87c52
                          created_at:
                            type: string
                            format: date-time
                            example: '2025-07-03T17:46:56.591Z'
                          updated_at:
                            type: string
                            format: date-time
                            example: '2025-07-03T17:46:56.598Z'
                          policy_name:
                            type: string
                            example: My Impersonation Policy
                          tracking_id:
                            type: string
                            example: 1321a352-7d7b-490d-a399-ca4b9a5cf30d
                          id:
                            type: string
                            example: 97960564-65e8-48ff-a34c-542d3bbd0ac4
                          rules:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  example: read
                                actors:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                        example: idp_user
                                      condition:
                                        type: string
                                        example: equals
                                      identifiers:
                                        type: array
                                        items:
                                          type: string
                                        example:
                                        - JOHN_DOE
                                targets:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                        example: repo_user
                                      condition:
                                        type: string
                                        example: equals
                                      identifiers:
                                        type: array
                                        items:
                                          type: string
                                          example:
                                          - REPO_USER
                          GSI1SK:
                            type: string
                            example: IMPERSONATION#97960564-65e8-48ff-a34c-542d3bbd0ac4
                          GSI1PK:
                            type: string
                            example: ORG#12e06dcd-8b2e-4102-82db-c8a692d87c52#POLICY
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /accessRequest:
    post:
      operationId: createAccessRequest
      tags:
      - access_request
      summary: Create a new access request
      description: An access request represents a user's request to access specific resources or perform certain actions within
        the system. This endpoint allows you to create a new access request. The request body must include details about the
        requester, justification, metadata, and rules defining the access request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requester_identity:
                  type: object
                  properties:
                    requester:
                      type: string
                      example: NAME
                      description: The name of the requester.
                    email:
                      type: string
                      example: name@company.com
                      description: The email of the requester.
                    role:
                      type: string
                      example: DEV_ROLE
                      description: The role of the requester.
                  required:
                  - requester
                justification:
                  type: string
                  example: Need access to perform data analysis.
                  description: Reason for the access request.
                snowflake_metadata:
                  type: object
                  properties:
                    account_region:
                      type: string
                      description: Region of the account.
                    account_name:
                      type: string
                      description: Name of the account.
                    organization_name:
                      type: string
                      description: Name of the current organization.
                rules:
                  type: array
                  description: Rules defining the access request.
                  items:
                    $ref: '#/components/schemas/SnowflakeAccessManagementRule'
                connection_id:
                  type: number
                  example: 1
                  description: Connection ID associated with the access request.
              required:
              - requester_identity
              - justification
              - rules
              - connection_id
      responses:
        '200':
          description: Access request created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AccessRequestPostResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getAccessRequests
      tags:
      - access_request
      summary: Retrieve all access requests
      description: This endpoint retrieves all access requests for the client. It supports pagination using the `exclusive_start_key`
        and `limit` query parameters. `exclusive_start_key` can be found in the response of the previous request under `last_evaluated_key`,
        under the `id` property. Use that value to get the next set of access requests.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: number
          default: 10
        description: The maximum number of access requests to retrieve.
      - name: requester
        in: query
        required: false
        schema:
          type: string
        description: The name of the individual who issued the access request.
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: OPEN
        description: The statues of the access request.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: The sort order of the access requests.
      - name: exclusive_start_key
        in: query
        required: false
        schema:
          type: string
        description: The key to start pagination from. This is an encoded JSON string.
      responses:
        '200':
          description: Access request retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /accessRequest/{id}:
    get:
      operationId: getAccessRequestById
      tags:
      - access_request
      summary: Retrieve a specific access request
      description: This endpoint retrieves a specific access request by its ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the access request.
      responses:
        '200':
          description: Access request retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /accessRequest/{id}/approve:
    put:
      operationId: approveAccessRequest
      tags:
      - access_request
      summary: Approve an access request
      description: This endpoint approves a specific access request by its ID. The access request must be in an OPEN status
        to be approved.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the access request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                justification:
                  type: string
                  description: Reason for approving the access request.
              required:
              - justification
      responses:
        '200':
          description: Access request approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /accessRequest/{id}/deny:
    put:
      operationId: denyAccessRequest
      tags:
      - access_request
      summary: Deny an access request
      description: This endpoint denies a specific access request by its ID. The access request must be in an OPEN status
        to be denied.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the access request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                justification:
                  type: string
                  description: Reason for denying the access request.
              required:
              - justification
      responses:
        '200':
          description: Access request denied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /accessRequest/{id}/cancel:
    put:
      operationId: cancelAccessRequest
      tags:
      - access_request
      summary: Cancel an access request
      description: This endpoint cancels a specific access request by its ID. The access request must be in an OPEN status
        to be canceled.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the access request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                justification:
                  type: string
                  description: Reason for canceling the access request.
              required:
              - justification
      responses:
        '200':
          description: Access request canceled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Unified Policy uses [HTTP Basic Authentication](https://swagger.io/docs/specification/authentication/basic-authentication/).<br/><br/>ALTR
        API keys are created and obtained on the API page in the ALTRnet (Settings > Preferences > API).<br/><br/>Usernames
        are the 'Key Names' listed on that page, and Passwords are the 'Key Secret' provided when an API key is created.
  responses:
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Not Found
            statusCode: 404
            date: '2022-07-20T18:00:58.723Z'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Bad Request
            statusCode: 400
            date: '2022-07-20T18:00:58.723Z'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Resource is forbidden
            statusCode: 403
            date: '2022-07-20T18:00:58.723Z'
    TooMany:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Too Many Requests
            statusCode: 429
            date: '2022-07-20T18:00:58.723Z'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Unauthorized
            statusCode: 401
            date: '2022-07-20T18:00:58.723Z'
    Unprocessed:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Unprocessable Entity
            statusCode: 422
            date: '2022-07-20T18:00:58.723Z'
    InternalError:
      description: Internal Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Internal Server Error
            statusCode: 500
            date: '2022-07-20T18:00:58.723Z'
    OkResponse:
      description: Indicates that the process was successful in being retrieved/sent. Does not necessarily mean that it will
        complete.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
              success:
                type: boolean
                example: true
  schemas:
    TimeWindowThreshold:
      description: Enforces a policy during a provided time window. Not available for pushdown policies.
      type: array
      items:
        type: object
        properties:
          day:
            type: array
            items:
              type: string
              enum:
              - sunday
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
              description: The user may not access data on these days of the week
          start_time:
            type: object
            properties:
              hour:
                example: '12'
                type: integer
                description: The hour of the day in 24 hour format. 0-23
              minute:
                example: '30'
                type: integer
                description: The minute of the hour. 0-59
            description: The user may not access data after this time and before the end_time.
          end_time:
            type: object
            properties:
              hour:
                example: '20'
                type: integer
                description: The hour of the day in 24 hour format. 0-23
              minute:
                example: '30'
                type: integer
                description: The minute of the hour. 0-59
            description: The user may not access data before this time and after the start_time.
          timezone:
            type: string
            example: America/New_York
            description: A zoneinfo/tz-database string for what timezone the threshold times should be applied in. See a list
              of TZ Identifiers at https://en.wikipedia.org/wiki/List_of_tz_database_time_zones.
          action:
            type: string
            enum:
            - ALERT
            - BLOCK
            description: Alerting will generate an alert in ALTR, Blocking will also block the users access to any connected
              data until the alert is cleared.
    AccessRateThreshold:
      description: Enforces a policy based on the number of accesses in a given time window. Not available for pushdown policies.
      type: array
      items:
        type: object
        properties:
          access_rate_unit:
            type: string
            enum:
            - minute
            - hour
            - day
            - week
            - month
            description: The time window starting at the first query until the ratebucket is reset
          access_rate_limit:
            type: integer
            description: The max access count in the given time window
            example: 100
          action:
            type: string
            enum:
            - ALERT
            - BLOCK
            description: Alerting will generate an alert in ALTR, Blocking will also block the users access to any connected
              data until the alert is cleared.
    CreatePolicyRequest:
      type: object
      properties:
        identifier:
          type: string
          description: 'For column policies, provide the column id, which can be retrieved from the `/data` endpoint in the
            Master API.


            For tag policies, provide the tag name as the value.'
          example: '1'
        type:
          type: string
          description: "You can create policy on columns or tags you have connected to ALTR.\nBy selecting `pushdown`, the\
            \ policy is implemented on a tag entirely inside the database (that is, the policy logic is \"pushed down\" to\
            \ the database) instead of reaching out to ALTR over the network at runtime for policy decisions. This is useful\
            \ in certain scenarios where performance is of paramount importance, but this implementation comes with significant\
            \ limitations and should not be used without discussion with ALTR support to fully understand the ramifications.\
            \ \n\n Please note that Push Down policies for columns is not presently supported, so assure that the identifier\
            \ is a tag name, not a column id."
          enum:
          - COLUMN
          - TAG
          - PUSHDOWN
          example: COLUMN
        active:
          type: boolean
          description: Indicates whether the policy is active and applied. Defaults to true.
          default: true
        database_ids:
          type: array
          description: The database_ids field is required only if the database being used is for a specific Databricks connection.
            If no database_ids are provided, the policy will apply to all Snowflake (SF) data sources across the account.
            If a Databricks ID is passed, the policy type cannot be 'COLUMN' and will result in a failure. The database ID
            can be retrieved from the /databases endpoint in the Master API.
          items:
            type: integer
            description: The database id to apply the policy to
            example: '1'
            maximum: 99
    Rule:
      type: object
      properties:
        access_rate_thresholds:
          $ref: '#/components/schemas/AccessRateThreshold'
        time_window_thresholds:
          $ref: '#/components/schemas/TimeWindowThreshold'
        masking_policy:
          type: integer
          enum:
          - 10000
          - 10001
          - 10002
          - 10003
          - 10004
          description: "The id of the masking policy which should be applied. If you have multiple conflicting masking policies\
            \ applied to a query the lowest id is used.\n * 10000 - No mask \n 10001 - Full Mask \n 10002 - Email Mask \n\
            \ 10004 - Constant Mask"
        role:
          type: string
          example: DEVELOPER_ROLE
          description: The name of the role associated with this rule.
        tag_value:
          type: string
          example: yellow
          description: The tag value to match for this rule. If you wish to use a regex, use 'tag_value_regex' instead.
        tag_value_regex:
          type: string
          enum:
          - '*'
          description: The REGEX for matching tag values to which this rule applies. If you wish to use an exact string match,
            you may use 'tag_value' instead. Only * is currently supported.
    AccessManagementPolicy:
      type: object
      properties:
        policy_name:
          type: string
          example: My Swagger Policy
          minLength: 1
          maxLength: 255
        description:
          type: string
          example: This is a policy generated via Swagger
          minLength: 1
          maxLength: 255
        policy_maintenance:
          type: object
          properties:
            rate:
              type: string
              enum:
              - day
              - cron
              example: day
              description: The rate at which the policy should be maintained. If set to cron, the cron expression must be
                provided in the cron field. The cron field must be a valid AWS Cloud Watch cron expression.
            value:
              oneOf:
              - type: string
              - type: number
          nullable: true
          default: null
        connection_ids:
          type: array
          items:
            type: integer
          minItems: 1
          maxItems: 1
          uniqueItems: true
          example:
          - 1
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SnowflakeAccessManagementRule'
        access_request_id:
          type: string
          description: The ID of the access request associated with this policy, if any.
          example: afe0b9c9-3a29-4de5-95d4-25a39787e157
      required:
      - policy_name
      - connection_ids
      - rules
    AccessManagementPolicyUpdate:
      type: object
      properties:
        policy_name:
          type: string
          example: My Swagger Policy
          minLength: 1
          maxLength: 255
        description:
          type: string
          example: This is a policy generated via Swagger
          minLength: 1
          maxLength: 255
        rules:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              actors:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - role
                    condition:
                      type: string
                      enum:
                      - equals
                      - starts_with
                      - ends_with
                    identifiers:
                      type: array
                      items:
                        type: string
                      uniqueItems: true
                      example:
                      - DEVELOPER_ROLE
                      - ADMINISTRATOR_ROLE
                  required:
                  - type
                  - condition
                minItems: 1
              objects:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - database
                      - schema
                      - table
                    condition:
                      type: string
                      enum:
                      - equals
                      - starts_with
                      - ends_with
                      - fully_qualified
                    identifiers:
                      type: array
                      items:
                        type: string
                      uniqueItems: true
                      example:
                      - DEVELOPER_DATABASE
                      - ADMINISTRATOR_DATABASE
                    fully_qualified_identifiers:
                      description: This field is required if the condition is fully_qualified
                      type: array
                      items:
                        description: This field is required if the condition is fully_qualified
                        type: object
                        properties:
                          database:
                            type: string
                            example: DEVELOPER_DATABASE
                          schema:
                            type: string
                            example: PUBLIC
                          table:
                            type: string
                            example: USERS
                          view:
                            type: string
                            example: USERS
                        nullable: true
                  required:
                  - type
                  - condition
                minItems: 1
              access:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      enum:
                      - read
                      - write
                  required:
                  - name
                minItems: 1
                maxItems: 2
            required:
            - actors
            - objects
            - access
      required:
      - policy_name
      - rules
    AccessManagementPolicyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            policy_id:
              type: string
              example: GRANT#afe0b9c9-3a29-4de5-95d4-25a39787e157#DATABASE_TYPE#9
            policy:
              type: object
              properties:
                PK:
                  type: string
                  example: ORG#a0a7b846-95d5-4248-a8c5-406e018d591a#POLICY
                SK:
                  type: string
                  example: GRANT#afe0b9c9-3a29-4de5-95d4-25a39787e157#DATABASE_TYPE#9
                client_id:
                  type: string
                  example: a0a7b846-95d5-4248-a8c5-406e018d591a
                created_at:
                  type: string
                  format: date-time
                  example: '2025-02-07T16:12:12.807Z'
                updated_at:
                  type: string
                  format: date-time
                  example: '2025-02-07T16:12:12.807Z'
                policy_name:
                  type: string
                  example: Swagger Policy
                description:
                  type: string
                  example: This is a policy generated via Swagger
                connection_ids:
                  type: array
                  items:
                    type: integer
                  example:
                  - 4
                rules_pending:
                  type: array
                  items:
                    type: object
                    properties:
                      actors:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              example: role
                            condition:
                              type: string
                              example: equals
                            identifiers:
                              type: array
                              items:
                                type: string
                              example:
                              - MY_ROLE
                      objects:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              example: schema
                            condition:
                              type: string
                              example: equals
                            identifiers:
                              type: array
                              items:
                                type: string
                              example:
                              - PUBLIC
                      access:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: read
                rules_applied:
                  type: string
                  nullable: true
                  example: null
                rules_failed:
                  type: string
                  nullable: true
                  example: null
                report_id:
                  type: string
                  nullable: true
                  example: 924ef8b9-22fb-4f20-a15d-a4b1948b285f
                GSI1SK:
                  type: string
                  example: ACTIVE#GRANT#afe0b9c9-3a29-4de5-95d4-25a39787e157#DATABASE_TYPE#9
                GSI1PK:
                  type: string
                  example: ORG#a0a7b846-95d5-4248-a8c5-406e018d591a#POLICY
                id:
                  type: string
                  example: afe0b9c9-3a29-4de5-95d4-25a39787e157
                tracking_id:
                  type: string
                  example: 924ef8b9-22fb-4f20-a15d-a4b1948b285f
                database_type:
                  type: integer
                  example: 9
                this_status:
                  type: string
                  example: ACTIVE
    ImpersonationPolicyRequest:
      type: object
      properties:
