          - ROW
          - OLTP
          example: TAG
        description: Type of the policy to be queried. E.g., 'TAG','COLUMN', 'PUSHDOWN'.
      - name: sort_by
        description: ' The order of the returned policies to sort by'
        example: updated_at
        in: query
        schema:
          type: string
          enum:
          - name
