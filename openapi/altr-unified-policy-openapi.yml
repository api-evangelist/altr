      tags:
      - policy
      summary: Creates a policy without any rules attached.
      description: This endpoint allows you to create a policy without any associated rules. Rules can be added using the
        appropriate `/policy/{policy_id}/rules` endpoints or by creating a policy with rules by using the `policy/withRules`
        endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
            examples:
              SnowflakeColumnPolicy:
                summary: Snowflake - Column Policy
                description: This is an example of a column policy for Snowflake.
                value:
                  identifier: '1'
                  type: COLUMN
              SnowflakeTagPolicy:
                summary: Snowflake - Tag Policy
                description: This is an example of a tag policy for Snowflake.
                value:
                  identifier: MY_TAG_NAME
                  type: TAG
              SnowflakePushDownPolicy:
                summary: Snowflake - Push Down Policy
                description: This is an example of a push down policy for Snowflake. Please note that identifiers here will
                  be assumed to be a tag name value, not a column identifier, as the column identifier for push down is not
                  supported at the moment.
                value:
                  identifier: MY_TAG_NAME
                  type: PUSHDOWN
              DatabricksTagPolicy:
                summary: Databricks - Tag Policy
                description: This is an example of a tag policy for Snowflake. Notice that database_ids is now supplied. The
                  database ids MUST all be valid databricks database ids. These can be found by using the `GET /database`
                  endpoint in the Master API.
                value:
                  identifier: MY_TAG_NAME
                  type: TAG
                  database_ids:
                  - 1
      responses:
        '202':
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      policy_id:
                        type: string
                        example: COLUMN#iiowdjioqi213u90jdd0wau90
