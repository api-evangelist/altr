overlay: 1.0.0
info:
  title: API Evangelist enhancements for ALTR — ALTR Audit Report API
  version: 1.0.0
extends: openapi/altr-audit-report-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: altr
    x-apievangelist-harvested: '2026-08-06'
    x-apievangelist-source: ALTR public Swagger UI
    x-apievangelist-spec-version: 3.1.0
    x-apievangelist-operations: 17
    x-apievangelist-operations-with-operationid: 0
- target: $.info
  update:
    x-apievangelist-artifacts:
      authentication: authentication/altr-authentication.yml
      conventions: conventions/altr-conventions.yml
      errors: errors/altr-problem-types.yml
      lifecycle: lifecycle/altr-lifecycle.yml
      conformance: conformance/altr-conformance.yml
      mcp: mcp/altr-mcp.yml
      tool_crosswalk: mcp/altr-tool-crosswalk.yml
- target: $.info
  update:
    x-apievangelist-gap-operationid: 17 of 17 operations declare no operationId, so agent tooling and the MCP tool crosswalk
      must bind them by method+path.
